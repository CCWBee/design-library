<!--
  Structure Flow — rotating dome of drifting particles (Three.js points)
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/TSX component wrapper, ResizeObserver/IntersectionObserver visibility plumbing,
  host-app className/mask props and Tailwind scaffolding, TypeScript types — kept the bare
  WebGL point-cloud renderer and rebuilt it as plain JS driven by requestAnimationFrame.
-->
<title>Structure Flow</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050608;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 50%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 20%, black 50%, black 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  label {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }
</style>

<div id="stage"><canvas id="scene"></canvas></div>
<label>Structure Flow</label>

<script src="three.min.js"></script>
<script>
(function () {
  var OPTIONS = { speed: 1, pointSize: 0.08, opacity: 0.4 };

  var canvas = document.getElementById('scene');
  var host = document.getElementById('stage');

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
  camera.position.z = 30;
  camera.position.y = 5;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var geometry = new THREE.BufferGeometry();
  var count = 15000;
  var positions = new Float32Array(count * 3);
  var radius = 25;
  for (var i = 0; i < count; i += 1) {
    var u = Math.random();
    var theta = u * 2 * Math.PI;
    var phi = Math.acos(Math.random() * 0.8 + 0.2);
    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.cos(phi) - 20;
    positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  var material = new THREE.PointsMaterial({
    size: OPTIONS.pointSize,
    color: 0xffffff,
    transparent: true,
    opacity: OPTIONS.opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  var particles = new THREE.Points(geometry, material);
  scene.add(particles);

  function resize() {
    var width = host.clientWidth;
    var height = host.clientHeight;
    camera.aspect = width / Math.max(1, height);
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
  }

  var frame = 0;
  function tick() {
    particles.rotation.y += 0.0008 * OPTIONS.speed;
    particles.rotation.z += 0.0002 * OPTIONS.speed;
    material.size = OPTIONS.pointSize;
    material.opacity = OPTIONS.opacity;
    renderer.render(scene, camera);
    frame = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  tick();
})();
</script>
