<!--
  Defense Lines
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped/stubbed: Tailwind CDN scaffolding rebuilt as plain CSS, Iconify icons removed,
  GSAP entrance/ScrollTrigger replaced with a plain CSS/rAF fade-in, Google Fonts swapped
  for the system font stack, and the remote Supabase texture image replaced with a local
  CSS gradient/diagonal-hatch stand-in. Canvas particle streaks and the 3D card carousel
  (mouse-tracked rotation, per-card hover float) are the genuine effect and are unchanged.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defense Lines</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030303;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  #bg-canvas {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    width: 800px;
    height: 500px;
    background: rgba(220, 38, 38, 0.10);
    border-radius: 999px;
    filter: blur(150px);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 400px;
    perspective: 1200px;
  }
  #carousel {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
  }

  .card {
    position: absolute;
    width: 128px;
    height: 230px;
    border-radius: 12px;
    cursor: default;
  }
  .card.left0 { z-index: 0;  background: linear-gradient(to right, #0a0202, #1f0505); border: 1px solid rgba(127,29,29,0.10); transform: translateX(-180%) translateZ(-400px) rotateY(35deg); opacity: 0.15; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  .card.left1 { z-index: 10; background: linear-gradient(to right, #140303, #3d0a0a); border: 1px solid rgba(127,29,29,0.20); transform: translateX(-120%) translateZ(-250px) rotateY(25deg); opacity: 0.4; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .card.left2 { z-index: 20; background: linear-gradient(to right, #290606, #6b1111); border: 1px solid rgba(185,28,28,0.30); transform: translateX(-60%) translateZ(-100px) rotateY(15deg); opacity: 0.7; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
  .card.right0 { z-index: 0;  background: linear-gradient(to left, #0a0202, #1f0505); border: 1px solid rgba(127,29,29,0.10); transform: translateX(180%) translateZ(-400px) rotateY(-35deg); opacity: 0.15; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  .card.right1 { z-index: 10; background: linear-gradient(to left, #140303, #3d0a0a); border: 1px solid rgba(127,29,29,0.20); transform: translateX(120%) translateZ(-250px) rotateY(-25deg); opacity: 0.4; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .card.right2 { z-index: 20; background: linear-gradient(to left, #290606, #6b1111); border: 1px solid rgba(185,28,28,0.30); transform: translateX(60%) translateZ(-100px) rotateY(-15deg); opacity: 0.7; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }

  .card.center {
    width: 144px;
    height: 269px;
    z-index: 30;
    background: linear-gradient(135deg, #ff4747, #cc0000);
    border: 1px solid rgba(252,165,165,0.4);
    overflow: hidden;
    transform: translateZ(50px);
    box-shadow: 0 0 80px 15px rgba(220,38,38,0.35), inset 0 0 30px rgba(255,255,255,0.15);
  }
  .center-texture {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.6;
    mix-blend-mode: multiply;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35) 0%, transparent 60%),
      linear-gradient(135deg, #3a0a0a 0%, #7a1414 100%);
  }
  .center-hatch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image:
      radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.15) 0px, rgba(255,255,255,0.15) 2px, transparent 2px, transparent 12px);
  }

  @media (min-width: 640px) {
    .stage { height: 650px; }
    .card { width: 256px; height: 422px; }
    .card.center { width: 288px; height: 461px; }
  }

  #hero-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    z-index: 40;
  }

  #hero-badge {
    opacity: 0;
    color: #f87171;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: opacity 0.9s ease, transform 0.9s ease;
    transform: translateY(20px);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 300;
    letter-spacing: -0.01em;
    color: #f5f5f5;
    line-height: 1;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 48px;
    text-shadow: 0 10px 40px rgba(0,0,0,0.9);
    margin: 0;
  }
  h1 .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  h1 .line.accent { font-style: italic; color: #fecaca; }
  h1 .word-mask { display: inline-flex; overflow: hidden; padding-bottom: 4px; }
  h1 .word {
    display: inline-block;
    transform: translateY(120%);
    transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (min-width: 640px) { h1 { font-size: 96px; } }

  #hero-button {
    opacity: 0;
    transform: translateY(20px);
    margin-top: 40px;
    padding: 16px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 300;
    color: #fff;
    background: #dc2626;
    border: 1px solid rgba(239,68,68,0.5);
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  #hero-button .arrow { font-size: 16px; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="glow"></div>

<main>
  <div class="stage">
    <div id="carousel">
      <div class="card left0"></div>
      <div class="card left1"></div>
      <div class="card left2"></div>

      <div class="card right0"></div>
      <div class="card right1"></div>
      <div class="card right2"></div>

      <div class="card center">
        <div class="center-texture"></div>
        <div class="center-hatch"></div>
      </div>
    </div>
  </div>

  <div id="hero-text">
    <div id="hero-badge">
      <span>Continuous network surveillance</span>
    </div>

    <h1>
      <div class="line">
        <span class="word-mask"><span class="word">Expose</span></span>
        <span class="word-mask"><span class="word">hidden</span></span>
        <span class="word-mask"><span class="word">vulnerabilities</span></span>
      </div>
      <div class="line accent">
        <span class="word-mask"><span class="word">within</span></span>
        <span class="word-mask"><span class="word">your</span></span>
        <span class="word-mask"><span class="word">cloud</span></span>
        <span class="word-mask"><span class="word">infrastructure</span></span>
      </div>
    </h1>

    <div id="hero-button">
      <span>Start threat assessment</span>
      <span class="arrow">&#8594;</span>
    </div>
  </div>
</main>

<script>
(function () {
  // Background canvas: streaking particle lines
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var width, height, particles = [];

  function initCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    particles = [];
    var particleCount = window.innerWidth < 768 ? 40 : 100;

    for (var i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        baseLength: Math.random() * 80 + 20,
        speedY: Math.random() * 0.8 + 0.2,
        baseOpacity: Math.random() * 0.2 + 0.05
      });
    }
  }

  window.addEventListener('resize', initCanvas);
  initCanvas();

  function animateCanvas() {
    ctx.clearRect(0, 0, width, height);
    var centerX = width / 2;
    var centerY = height / 2;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';

    particles.forEach(function (p) {
      var distFromCenterX = Math.abs(p.x - centerX);
      var distFromCenterY = Math.abs(p.y - centerY);

      var proximityX = Math.max(0, 1 - (distFromCenterX / (width / 2)));
      var proximityY = Math.max(0, 1 - (distFromCenterY / (height / 2)));
      var centerProximity = proximityX * (0.4 + proximityY * 0.6);

      var currentLength = p.baseLength * (1 + centerProximity * 4);
      var currentOpacity = Math.min(1.0, p.baseOpacity + (centerProximity * 2.0));
      var brightness = Math.floor(centerProximity * 180);

      ctx.beginPath();
      var grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + currentLength);
      grad.addColorStop(0, 'rgba(220, 38, 38, 0)');
      grad.addColorStop(0.5, 'rgba(255, ' + (38 + brightness) + ', ' + (38 + brightness) + ', ' + currentOpacity + ')');
      grad.addColorStop(1, 'rgba(220, 38, 38, 0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = 0.5;
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x, p.y + currentLength);
      ctx.stroke();

      p.y -= p.speedY * 1.5 * (1 + centerProximity * 0.5);

      if (p.y + currentLength < 0) {
        p.y = height;
        p.x = Math.random() * width;
      }
    });
    requestAnimationFrame(animateCanvas);
  }
  animateCanvas();

  // 3D card carousel: idle float, mouse-tracked rotation, hover lift
  var carousel = document.getElementById('carousel');
  var cards = document.querySelectorAll('.card');
  var time = 0;
  var targetRotateY = 0;
  var currentRotateY = 0;

  cards.forEach(function (card) {
    card.addEventListener('mouseenter', function () { card.isHovered = true; });
    card.addEventListener('mouseleave', function () { card.isHovered = false; });
    card.hoverAmt = 0;
  });

  window.addEventListener('mousemove', function (e) {
    var x = (e.clientX / window.innerWidth) - 0.5;
    targetRotateY = x * 40;
  });

  function animateCards() {
    time += 0.015;
    currentRotateY += (targetRotateY - currentRotateY) * 0.08;
    carousel.style.transform = 'rotateY(' + currentRotateY + 'deg)';

    cards.forEach(function (card, index) {
      if (!card.dataset.baseTransform) {
        card.dataset.baseTransform = getComputedStyle(card).transform === 'none' ? '' : card.style.transform;
        var match = (card.getAttribute('style') || '').match(/translateX\(([^)]+)\)/);
        card.directionX = match ? parseFloat(match[1]) : 0;
        card.dataset.baseTransform = card.style.transform;
      }

      var targetHover = card.isHovered ? 1 : 0;
      card.hoverAmt += (targetHover - card.hoverAmt) * 0.15;

      var hoverZ = card.hoverAmt * 60;
      var hoverY = card.hoverAmt * -20;
      var hoverX = 0;

      if (card.directionX < 0) hoverX = card.hoverAmt * -40;
      else if (card.directionX > 0) hoverX = card.hoverAmt * 40;

      var offset = Math.sin(time + (index * 0.5)) * 8;

      card.style.transform = card.dataset.baseTransform + ' translateX(' + hoverX + 'px) translateY(' + (offset + hoverY) + 'px) translateZ(' + hoverZ + 'px)';
    });
    requestAnimationFrame(animateCards);
  }
  animateCards();

  // Simple entrance fade/slide, no GSAP dependency
  setTimeout(function () {
    document.querySelectorAll('.word').forEach(function (w, i) {
      setTimeout(function () { w.style.transform = 'translateY(0%)'; }, i * 60);
    });
    var badge = document.getElementById('hero-badge');
    var button = document.getElementById('hero-button');
    setTimeout(function () {
      badge.style.opacity = '1';
      badge.style.transform = 'translateY(0)';
    }, 400);
    setTimeout(function () {
      button.style.opacity = '1';
      button.style.transform = 'translateY(0)';
    }, 700);
  }, 150);
})();
</script>

</body>
</html>
