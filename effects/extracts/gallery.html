<!--
  Gallery — rotating cylindrical image-panel gallery (Three.js)
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React component wrapper, product/bouquet photography assets, Tailwind/host
  scaffolding, resize/intersection lifecycle plumbing tied to a host app. The five real
  photographs were replaced with procedurally drawn canvas textures (abstract colour
  fields) so the file carries no marketing imagery and no network or asset dependency.
-->
<title>Gallery</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #16161b 0%, #0b0b0d 70%);
  }
  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  .label {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.38);
    pointer-events: none;
    user-select: none;
  }
</style>

<div id="stage">
  <canvas id="canvas" aria-hidden="true"></canvas>
</div>
<div class="label">Gallery</div>

<script src="three.min.js"></script>
<script>
(function () {
  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  // Procedurally draw a set of abstract "artwork" textures on canvas, in
  // place of the original photographic assets, so the file needs no
  // external images.
  function makePlateTexture(seed) {
    const size = 512;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const ctx = c.getContext('2d');

    const palettes = [
      ['#f4d9c6', '#e8927c', '#4b3f72'],
      ['#c9e4de', '#7ec4a0', '#2c3e50'],
      ['#f7e1d7', '#d9a5b3', '#5b4a6f'],
      ['#dbe7e4', '#88a0a8', '#2f3e46'],
      ['#f6f0e6', '#e0b678', '#6a4c3c'],
    ];
    const palette = palettes[seed % palettes.length];

    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, palette[0]);
    grad.addColorStop(0.55, palette[1]);
    grad.addColorStop(1, palette[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    // Soft overlapping circles to suggest depth without depicting anything
    // representational.
    const rand = mulberry32(seed * 97 + 13);
    for (let i = 0; i < 10; i++) {
      const r = 40 + rand() * 140;
      const x = rand() * size;
      const y = rand() * size;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${0.05 + rand() * 0.12})`;
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // A few fine strokes for texture.
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 24; i++) {
      ctx.beginPath();
      ctx.moveTo(rand() * size, rand() * size);
      ctx.lineTo(rand() * size, rand() * size);
      ctx.stroke();
    }

    const texture = new THREE.CanvasTexture(c);
    texture.encoding = THREE.sRGBEncoding;
    texture.needsUpdate = true;
    return texture;
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.z = 18;

  const gallery = new THREE.Group();
  scene.add(gallery);

  const geometry = new THREE.CylinderGeometry(5, 5, 1.8, 64, 1, true, 0, Math.PI * 0.4);

  const PLATE_COUNT = 5;
  const textures = Array.from({ length: PLATE_COUNT }, (_, i) => makePlateTexture(i));

  const materials = Array.from({ length: 16 }, (_, index) => new THREE.MeshBasicMaterial({
    map: textures[index % textures.length],
    opacity: 0.85,
    side: THREE.DoubleSide,
    toneMapped: false,
    transparent: true,
  }));

  materials.forEach((material, index) => {
    const panel = new THREE.Mesh(geometry, material);
    panel.position.y = (index - 8) * 2.4;
    panel.rotation.y = (index / 16) * Math.PI * 4;
    gallery.add(panel);
  });

  const settings = { speed: 1, scale: 1 };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let elapsed = 0;
  let previousTime = 0;
  let frame = 0;
  let documentVisible = !document.hidden;

  function render(time) {
    time = time === undefined ? performance.now() : time;
    const safeSpeed = clamp(settings.speed, 0, 3);
    const safeScale = clamp(settings.scale, 0.7, 1.35);
    if (previousTime) elapsed += Math.min((time - previousTime) / 1000, 0.05) * safeSpeed;
    previousTime = time;
    gallery.rotation.y = elapsed * 0.18;
    gallery.position.y = Math.sin(elapsed) * 1.5;
    gallery.scale.setScalar(safeScale);
    renderer.render(scene, camera);
  }

  function tick(time) {
    if (!documentVisible) {
      frame = 0;
      previousTime = 0;
      return;
    }
    render(time);
    frame = window.requestAnimationFrame(tick);
  }

  function start() {
    if (reducedMotion) {
      render(0);
      return;
    }
    if (!frame && documentVisible) frame = window.requestAnimationFrame(tick);
  }

  function stop() {
    if (frame) window.cancelAnimationFrame(frame);
    frame = 0;
    previousTime = 0;
  }

  function resize() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    render();
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    documentVisible = !document.hidden;
    if (documentVisible) start();
    else stop();
  });

  resize();
  start();
})();
</script>
