<!--
  Vertex 9 - Global Data Field (rotating vertex mesh / flowing line lattice)
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: marketing copy panels, Tailwind CDN + utility classes, GSAP masked-text reveal,
  Iconify icons, Google Fonts link. Kept only the Three.js flowing line-lattice animation,
  rebuilt with hand-written CSS, running full viewport with the vendored local three.min.js.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex 9</title>
<style>
  :root {
    --bg: #0e100f;
    --line-start: #d1c5b4;
    --line-end: #7a7b76;
    --emblem: #d1c5b4;
    --label: rgba(209, 197, 180, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    position: relative;
  }
  #webgl-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  #webgl-canvas canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .depth-shadow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 160px rgba(14, 16, 15, 0.9);
    z-index: 10;
  }
  .emblem {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    mix-blend-mode: plus-lighter;
  }
  .emblem svg {
    width: 9rem;
    height: 9rem;
    color: var(--emblem);
    fill: currentColor;
    filter: drop-shadow(0 0 20px rgba(200, 185, 160, 0.15));
  }
  .label {
    position: fixed;
    bottom: 2rem;
    left: 2rem;
    z-index: 20;
    color: var(--label);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 300;
  }
</style>
</head>
<body>

<div id="webgl-canvas"></div>
<div class="depth-shadow"></div>

<div class="emblem">
  <svg viewBox="0 0 100 100">
    <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
    <path d="M50 20 L80 50 L50 80 L20 50 Z" opacity="0.4"></path>
    <circle cx="50" cy="50" r="6"></circle>
  </svg>
</div>

<div class="label">Global data field</div>

<script src="three.min.js"></script>
<script>
(function () {
  const container = document.getElementById('webgl-canvas');
  if (!container || typeof THREE === 'undefined') return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, -2, 9);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  const numLines = 60;
  const pointsPerLine = 100;

  const colorStart = new THREE.Color('#D1C5B4');
  const colorEnd = new THREE.Color('#7A7B76');

  for (let i = 0; i < numLines; i++) {
    const points = [];
    const xPos = (i - numLines / 2) * 0.22;
    for (let j = 0; j < pointsPerLine; j++) {
      const yPos = (j - pointsPerLine / 2) * 0.2;
      points.push(new THREE.Vector3(xPos, yPos, 0));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);

    const color = new THREE.Color().lerpColors(colorStart, colorEnd, i / numLines);

    const material = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.1 + (Math.random() * 0.25),
      blending: THREE.AdditiveBlending
    });

    const line = new THREE.Line(geometry, material);
    group.add(line);
  }

  // Tilt to create a flowing plane
  group.rotation.x = Math.PI / 3;
  group.rotation.z = -Math.PI / 8;

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime() * 0.4;

    group.children.forEach((line) => {
      const positions = line.geometry.attributes.position.array;
      for (let j = 0; j < pointsPerLine; j++) {
        const idx = j * 3;
        const x = positions[idx];
        const y = positions[idx + 1];

        const wave1 = Math.sin(y * 1.2 + time + x * 0.8) * 0.8;
        const wave2 = Math.cos(x * 1.5 - time * 0.8 + y * 0.5) * 0.6;

        positions[idx + 2] = wave1 + wave2;
      }
      line.geometry.attributes.position.needsUpdate = true;
    });

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

</body>
</html>
