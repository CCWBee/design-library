<!--
  Valence Core
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN + Google Fonts + Iconify + GSAP, marketing copy/headshots, remote links; layout rebuilt in plain CSS, entrance timeline rebuilt with a small CSS/JS fade sequence, WebGL shaders kept as-is.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valence Core</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    color: #fafafa;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.6;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 0%, rgba(10,10,10,0.8) 100%);
  }
  nav {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    z-index: 20;
    opacity: 0;
    transform: translateY(-20px);
    transition: opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
  }
  nav.in { opacity: 1; transform: translateY(0); }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #d4d4d4;
  }
  .brand .dot-atom {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid #06b6d4;
    box-shadow: 0 0 6px rgba(6,182,212,0.6);
  }
  .status-pill {
    position: relative;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(to right, rgba(6,182,212,0.5), rgba(115,115,115,0.1), transparent);
    display: none;
  }
  @media (min-width: 640px) {
    .status-pill { display: flex; align-items: center; }
  }
  .status-pill-inner {
    background: #0a0a0a;
    border-radius: 999px;
    padding: 0.5rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #d4d4d4;
  }
  main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 1rem;
    width: 100%;
    height: 100%;
    max-width: 56rem;
    margin: 0 auto;
  }
  .intro-tags {
    margin-bottom: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #tag-text {
    font-family: 'Courier New', monospace;
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #06b6d4;
    margin-bottom: 1.5rem;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1);
  }
  #tag-text.in { opacity: 1; transform: translateY(0); }
  h1 {
    font-size: 2.25rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #fafafa;
    margin: 0;
  }
  @media (min-width: 640px) { h1 { font-size: 3.75rem; } }
  @media (min-width: 768px) { h1 { font-size: 4.5rem; } }
  .word-wrap {
    display: inline-block;
    overflow: hidden;
    vertical-align: top;
    margin-right: 0.25em;
    padding-bottom: 0.1em;
  }
  .word-inner {
    display: inline-block;
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.8s cubic-bezier(.16,1,.3,1), opacity 0.8s cubic-bezier(.16,1,.3,1);
  }
  .word-inner.in { transform: translateY(0); opacity: 1; }
  p.lede {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: #a3a3a3;
    max-width: 28rem;
    font-weight: 400;
    line-height: 1.6;
  }
  @media (min-width: 640px) { p.lede { font-size: 1rem; } }
  #btn-container {
    margin-top: 2.5rem;
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 1.1s ease-out, transform 1.1s ease-out;
  }
  #btn-container.in { opacity: 1; transform: scale(1); }
  #btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 280px;
    height: 96px;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 18px;
    transition: transform .22s cubic-bezier(.34, 1.4, .5, 1);
    padding: 0;
  }
  #btn:hover { transform: translateY(-2px); }
  #btn:active { transform: translateY(1px) scale(.99); }
  #btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #06b6d4, 0 0 0 4px #0a0a0a;
  }
  #btn-gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 18px;
  }
  #btn span {
    position: relative;
    z-index: 10;
    pointer-events: none;
    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: #e0f7f8;
    text-shadow: 0 0 12px rgba(0, 210, 255, .6), 0 1px 4px rgba(0, 0, 0, .8);
  }
  #note-text {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: #737373;
    letter-spacing: 0.02em;
    font-weight: 400;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1);
  }
  #note-text.in { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="vignette"></div>

<nav id="main-nav">
  <div class="brand">
    <span class="dot-atom"></span>
    <span>VALENCE SYSTEM</span>
  </div>
  <div class="status-pill">
    <div class="status-pill-inner">
      <span style="width:6px;height:6px;border-radius:50%;background:#06b6d4;box-shadow:0 0 8px rgba(6,182,212,0.8);display:inline-block;"></span>
      <span>Induction active</span>
    </div>
  </div>
</nav>

<main>
  <div class="intro-tags">
    <div id="tag-text">Kinetic pulse</div>
    <h1 id="headline" data-split>Command the momentum.</h1>
    <p class="lede" id="lede" data-split>Initialise the valence induction loop. The kinetic perimeter is standing by for sequence execution.</p>
  </div>

  <div id="btn-container">
    <button id="btn" type="button">
      <canvas id="btn-gl" aria-hidden="true"></canvas>
      <span>VALENCE CORE</span>
    </button>
  </div>

  <p id="note-text">Hover to trigger neural arcs, click to release a synchronised valence discharge.</p>
</main>

<script>
  // --- Entrance sequencing (plain rAF/CSS, no GSAP) ---
  document.addEventListener('DOMContentLoaded', () => {
    // Split headline/lede into per-word spans for a reveal effect
    document.querySelectorAll('[data-split]').forEach(el => {
      const text = el.textContent;
      el.innerHTML = '';
      text.split(' ').forEach(word => {
        if (word.trim() === '') return;
        const wrap = document.createElement('span');
        wrap.className = 'word-wrap';
        const inner = document.createElement('span');
        inner.className = 'word-inner';
        inner.textContent = word;
        wrap.appendChild(inner);
        el.appendChild(document.createTextNode(' '));
        el.appendChild(wrap);
      });
    });

    const nav = document.getElementById('main-nav');
    const tag = document.getElementById('tag-text');
    const words = document.querySelectorAll('.word-inner');
    const btnContainer = document.getElementById('btn-container');
    const note = document.getElementById('note-text');

    const schedule = (el, delay) => setTimeout(() => el.classList.add('in'), delay);

    schedule(nav, 200);
    schedule(tag, 600);
    words.forEach((w, i) => schedule(w, 900 + i * 40));
    schedule(btnContainer, 1400);
    schedule(note, 1600);
  });

  // --- Core WebGL Logic ---
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function compileShader(gl, type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('shader compile failed:', gl.getShaderInfoLog(s));
      }
      return s;
    }

    function createProgram(gl, vsSrc, fsSrc) {
      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl, gl.VERTEX_SHADER, vsSrc));
      gl.attachShader(prog, compileShader(gl, gl.FRAGMENT_SHADER, fsSrc));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error('program link failed:', gl.getProgramInfoLog(prog));
      }
      return prog;
    }

    const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

    // --- 1. Ambient Background Canvas ---
    function initBackgroundGL() {
      const canvas = document.getElementById('bg-canvas');
      const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
      if (!gl) return;

      const FS_BG = `
        precision highp float;
        uniform vec2 u_res;
        uniform float u_time;

        float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p);
          vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),
                     mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);
        }
        float fbm(vec2 p){
          float v=0.0; float a=0.5;
          for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.05+vec2(9.7,3.1); a*=0.5; }
          return v;
        }
        void main(){
          vec2 uv = gl_FragCoord.xy / u_res.y;
          float t = u_time * 0.1;

          float n1 = fbm(uv * 1.5 + vec2(t * 0.2, t * 0.1));
          float n2 = fbm(uv * 2.0 - vec2(t * 0.15, -t * 0.2) + n1);

          vec3 baseCol = vec3(0.039, 0.039, 0.039);
          vec3 highlightCol = vec3(0.01, 0.08, 0.12);

          vec3 col = mix(baseCol, highlightCol, n2 * 0.4);

          vec2 grid = fract(uv * 20.0);
          float line = smoothstep(0.95, 1.0, max(grid.x, grid.y));
          col += vec3(0.015) * line * (1.0 - n1);

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      const prog = createProgram(gl, VS, FS_BG);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      const locP = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(locP);
      gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'u_res');
      const uTime = gl.getUniformLocation(prog, 'u_time');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      function render(now) {
        resize();
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, reduced ? 0 : now / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }

    // --- 2. Button WebGL: kinetic induction core ---
    function initButtonGL() {
      const btn = document.getElementById('btn');
      const canvas = document.getElementById('btn-gl');
      const gl = canvas.getContext('webgl', { alpha: false, antialias: true });
      if (!gl) {
        btn.style.background = '#062630';
        btn.style.boxShadow = '0 0 0 2px #00f2fe, 0 0 24px rgba(0, 242, 254, .5)';
        return;
      }

      const FS_BTN = [
        'precision highp float;',
        'uniform vec2 u_res;',
        'uniform float u_time;',
        'uniform float u_arcs;',
        'uniform float u_flash;',
        'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}',
        'float noise(vec2 p){',
        '  vec2 i=floor(p), f=fract(p);',
        '  vec2 u=f*f*(3.0-2.0*f);',
        '  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),',
        '             mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);',
        '}',
        'float fbm(vec2 p){',
        '  float v=0.0; float a=0.5;',
        '  for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.05+vec2(9.7,3.1); a*=0.5; }',
        '  return v;',
        '}',
        'float sdRBox(vec2 p, vec2 b, float r){',
        '  vec2 q = abs(p) - b + r;',
        '  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;',
        '}',
        'void main(){',
        '  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;',
        '  float ar = u_res.x / u_res.y;',
        '  vec2 hs = vec2(ar * 0.5 - 0.2, 0.5 - 0.2);',
        '  float d = sdRBox(p, hs, 0.14);',
        '  float t = u_time;',
        '  float hover = clamp(u_arcs / 6.0, 0.0, 1.0);',
        '  vec3 col = vec3(0.039, 0.039, 0.039);',
        '  float plate = 1.0 - smoothstep(-0.004, 0.004, d);',
        '  vec3 plateCol = vec3(0.04, 0.05, 0.055);',
        '  plateCol += vec3(0.014, 0.022, 0.035) * fbm(p * 9.0);',
        '  plateCol += vec3(0.0, 0.25, 0.3) * exp(d * 9.0) * (0.25 + hover * 0.6);',
        '  col = mix(col, plateCol, plate);',
        '  col *= 1.0 + 0.5 * exp(-max(d, 0.0) * 16.0) * (1.0 - plate);',
        '  float a = atan(p.y, p.x);',
        '  vec3 arcCol = vec3(0.0);',
        '  for (int i = 0; i < 6; i++) {',
        '    float fi = float(i);',
        '    float w = clamp(u_arcs - fi, 0.0, 1.0);',
        '    float n1 = fbm(vec2(a * 2.4 + fi * 11.3, t * (1.6 + fi * 0.27) + fi * 53.1));',
        '    float off = (n1 - 0.5) * (0.11 + u_flash * 0.1);',
        '    float seg = smoothstep(0.35, 0.75, noise(vec2(a * 1.8 + fi * 7.7, t * (0.9 + fi * 0.13) + fi * 19.0)));',
        '    seg = 0.3 + 0.7 * seg;',
        '    float g = 0.0042 / (abs(d + off) + 0.006);',
        '    arcCol += (vec3(0.0, 0.75, 0.9) * g + vec3(0.6, 1.0, 0.95) * g * g * 0.55) * w * seg;',
        '  }',
        '  float outerMask = 1.0 - smoothstep(0.04, 0.15, d);',
        '  col += arcCol * (0.6 + 0.4 * hover) * outerMask;',
        '  float ring = 0.006 / (abs(d) + 0.006);',
        '  col += vec3(0.8, 0.98, 1.0) * ring * u_flash * 1.5 * outerMask;',
        '  col += vec3(0.7, 0.95, 1.0) * u_flash * 0.16 * outerMask;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n');

      const prog = createProgram(gl, VS, FS_BTN);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      const locP = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(locP);
      gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'u_res');
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uArcs = gl.getUniformLocation(prog, 'u_arcs');
      const uFlash = gl.getUniformLocation(prog, 'u_flash');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      let arcs = 2.4, arcsTarget = 2.4, flash = 0, crawl = 0;
      let last = performance.now();

      btn.addEventListener('mouseenter', () => arcsTarget = 5.8);
      btn.addEventListener('mouseleave', () => arcsTarget = 2.4);
      btn.addEventListener('focus', () => arcsTarget = 5.8);
      btn.addEventListener('blur', () => arcsTarget = 2.4);
      btn.addEventListener('click', () => flash = 1);

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        arcs += (arcsTarget - arcs) * Math.min(1, dt * 5);
        flash *= Math.exp(-3.6 * dt);
        crawl += dt * (0.6 + (arcs / 6) * 1.1 + flash * 2.0);
        resize();
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, reduced ? 3.0 : crawl);
        gl.uniform1f(uArcs, arcs);
        gl.uniform1f(uFlash, flash);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    initBackgroundGL();
    initButtonGL();
  })();
</script>
</body>
</html>
