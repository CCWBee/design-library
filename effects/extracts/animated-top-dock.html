  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/TSX component wrapper, product/brand copy, the "ThreeUI Fragment Mono"
  webfont (replaced with a system monospace stack), and the Tailwind-adjacent build
  scaffolding — kept the pointer-proximity spring physics and CSS visuals as plain JS/CSS.

<title>Animated Top Dock</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #080808;
  }

  body {
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .animated-top-dock-component {
    position: relative;
    display: grid;
    place-items: center;
    isolation: isolate;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
    color: #ecece8;
    background:
      radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.035), transparent 34%),
      #080808;
  }

  .animated-top-dock-component::after {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    content: "";
    opacity: 0.12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
  }

  .animated-top-dock__nav {
    position: absolute;
    top: clamp(24px, 5cqw, 46px);
    left: 50%;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    gap: 3px;
    height: 38px;
    padding: 4px;
    overflow: visible;
    border: 1px solid #292929;
    border-radius: 11px;
    background: rgba(14, 14, 14, 0.86);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.035);
    backdrop-filter: blur(18px) saturate(75%);
    transform: translateX(-50%);
    isolation: isolate;
  }

  .animated-top-dock__item {
    position: relative;
    z-index: 6;
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    height: 28px;
    min-width: 0;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 7px;
    outline: none;
    color: #858580;
    background: rgba(21, 21, 20, 0.9);
    font: 400 10px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
    letter-spacing: 0.1em;
    white-space: nowrap;
    backdrop-filter: blur(14px) saturate(70%);
    transform-origin: 50% 0;
    transition: color 0.15s, border-color 0.18s, background 0.18s, box-shadow 0.18s;
    will-change: width, height, transform;
    cursor: pointer;
  }

  .animated-top-dock__item[data-dock-near="true"],
  .animated-top-dock__item:focus-visible {
    z-index: 7;
    color: #ecece8;
    border-color: #41413e;
    background: rgba(27, 27, 26, 0.94);
    box-shadow: 0 7px 16px rgba(0, 0, 0, 0.26);
  }

  .animated-top-dock__logo {
    width: 28px;
    height: 28px;
    overflow: hidden;
    background: #e8e8e3;
  }

  .animated-top-dock__logo svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .animated-top-dock__link {
    gap: 6px;
    width: 94px;
    padding: 0 9px;
  }

  .animated-top-dock__link[aria-pressed="true"] {
    color: #111;
    border-color: #e8e8e3;
    background: #e8e8e3;
    box-shadow: 0 7px 18px rgba(0, 0, 0, 0.28);
  }

  .animated-top-dock__icon {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 13px;
    height: 13px;
    opacity: 0.62;
    transition: opacity 0.16s;
  }

  .animated-top-dock__icon svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .animated-top-dock__item[data-dock-near="true"] .animated-top-dock__icon,
  .animated-top-dock__item:focus-visible .animated-top-dock__icon {
    opacity: 1;
  }

  .animated-top-dock-component__caption {
    position: absolute;
    right: 18px;
    bottom: 16px;
    z-index: 6;
    color: #62625e;
    font: 400 9px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
    letter-spacing: 0.1em;
  }

  @media (max-width: 600px) {
    .animated-top-dock__nav {
      top: 24px;
      gap: 2px;
      height: 36px;
    }

    .animated-top-dock__item {
      height: 26px !important;
      transform: none !important;
    }

    .animated-top-dock__logo {
      width: 26px !important;
      height: 26px !important;
    }

    .animated-top-dock__link {
      width: auto !important;
      padding: 0 7px;
      font-size: 8px;
      letter-spacing: 0.07em;
    }

    .animated-top-dock__icon {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .animated-top-dock__item {
      transform: none !important;
    }
  }
</style>

<div class="animated-top-dock-component">
  <nav class="animated-top-dock__nav" aria-label="Animated top dock" data-dock-state="idle" data-dock-max="0.00">
    <button class="animated-top-dock__item animated-top-dock__logo" data-dock-item type="button" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="4.5" fill="#E8E8E3" /><path d="M6 6h8.6L18 9.35v8.15H9.15L6 14.35V6Z" fill="#111" /><path d="M9 9h5.15L15 9.85V15H9.85L9 14.15V9Z" fill="#E8E8E3" /><path d="M12 9v6M9 12h6" stroke="#111" stroke-width=".7" /></svg>
    </button>
    <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="true">
      <span class="animated-top-dock__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.25" y="2.25" width="4.5" height="4.5" rx=".8" /><rect x="9.25" y="2.25" width="4.5" height="4.5" rx=".8" /><rect x="2.25" y="9.25" width="4.5" height="4.5" rx=".8" /><rect x="9.25" y="9.25" width="4.5" height="4.5" rx=".8" /></svg></span>
      <span>SYSTEM</span>
    </button>
    <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false">
      <span class="animated-top-dock__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5" /><circle cx="12.5" cy="3.5" r="1.5" /><circle cx="12.5" cy="12.5" r="1.5" /><path d="M4.5 7.3 11 4.2M4.5 8.7l6.5 3.1" /></svg></span>
      <span>METHOD</span>
    </button>
    <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false">
      <span class="animated-top-dock__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" /><path d="M2 6h12M5 4.5h.01M7 4.5h.01" /></svg></span>
      <span>WORK</span>
    </button>
    <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false">
      <span class="animated-top-dock__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="5.2" cy="6.2" r="2.7" /><path d="m7.2 8.2 5.9 5.1M10.2 10.8l1.5-1.5M12 12.4l1.4-1.4" /></svg></span>
      <span>ACCESS</span>
    </button>
    <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false">
      <span class="animated-top-dock__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2.25h5.4L12 4.85v8.9H4z" /><path d="M9.25 2.25V5h2.7M6 8h4M6 10.5h4" /></svg></span>
      <span>NOTES</span>
    </button>
  </nav>
  <p class="animated-top-dock-component__caption">MOVE ACROSS THE DOCK · FOCUS WITH TAB</p>
</div>

<script>
(function () {
  var OPTIONS = {
    proximity: 122,
    spring: 0.19,
    damping: 0.7,
    widthGrowth: 17,
    heightGrowth: 16,
    drop: 3.5,
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function createTopDockController(root) {
    var reducedQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    var precisionQuery = window.matchMedia("(hover:hover) and (pointer:fine)");
    var items = Array.prototype.slice.call(root.querySelectorAll("[data-dock-item]")).map(function (element) {
      return { element: element, baseWidth: 0, baseHeight: 0, value: 0, velocity: 0, target: 0 };
    });

    var enabled = false;
    var pointerActive = false;
    var dirty = false;
    var frame = 0;

    function canAnimate() {
      return !reducedQuery.matches && root.clientWidth > 0 && window.innerWidth > 600 && precisionQuery.matches;
    }

    function measure() {
      enabled = canAnimate();
      items.forEach(function (state) {
        state.element.style.width = "";
        state.element.style.height = "";
        state.element.style.transform = "";
        state.element.dataset.dockNear = "false";
      });
      items.forEach(function (state) {
        var rect = state.element.getBoundingClientRect();
        state.baseWidth = rect.width;
        state.baseHeight = rect.height;
        state.value = 0;
        state.velocity = 0;
        state.target = 0;
      });
      pointerActive = false;
      dirty = false;
      root.dataset.dockState = enabled ? "idle" : "static";
      root.dataset.dockMax = "0.00";
    }

    function setTargets(clientX) {
      if (!enabled) return;
      var rects = items.map(function (state) { return state.element.getBoundingClientRect(); });
      for (var index = 0; index < items.length; index += 1) {
        var center = rects[index].left + rects[index].width * 0.5;
        var proximity = clamp(1 - Math.abs(clientX - center) / Math.max(1, OPTIONS.proximity), 0, 1);
        var influence = proximity * proximity * (3 - 2 * proximity);
        items[index].target = influence;
        items[index].element.dataset.dockNear = influence > 0.08 ? "true" : "false";
      }
      pointerActive = true;
      dirty = true;
      root.dataset.dockState = "active";
    }

    function focusItem(item) {
      if (!enabled) return;
      var index = items.findIndex(function (state) { return state.element === item; });
      if (index < 0) return;
      items.forEach(function (state, itemIndex) {
        state.target = itemIndex === index ? 1 : Math.abs(itemIndex - index) === 1 ? 0.24 : 0;
        state.element.dataset.dockNear = state.target > 0.08 ? "true" : "false";
      });
      pointerActive = false;
      dirty = true;
      root.dataset.dockState = "focus";
    }

    function reset() {
      pointerActive = false;
      dirty = true;
      items.forEach(function (state) {
        state.target = 0;
        state.element.dataset.dockNear = "false";
      });
    }

    function draw() {
      if (enabled && dirty) {
        var moving = false;
        var maxValue = 0;
        items.forEach(function (state) {
          state.velocity += (state.target - state.value) * OPTIONS.spring;
          state.velocity *= OPTIONS.damping;
          state.value += state.velocity;
          if (Math.abs(state.target - state.value) < 0.001 && Math.abs(state.velocity) < 0.001) {
            state.value = state.target;
            state.velocity = 0;
          } else {
            moving = true;
          }

          var value = clamp(state.value, 0, 1.08);
          var isLogo = state.element.classList.contains("animated-top-dock__logo");
          var extraWidth = isLogo ? OPTIONS.widthGrowth * (14 / 17) : Math.min(OPTIONS.widthGrowth, state.baseWidth * 0.24);
          var extraHeight = isLogo ? OPTIONS.heightGrowth * (14 / 16) : OPTIONS.heightGrowth;
          state.element.style.width = (state.baseWidth + extraWidth * value).toFixed(2) + "px";
          state.element.style.height = (state.baseHeight + extraHeight * value).toFixed(2) + "px";
          state.element.style.transform = "translateY(" + (value * OPTIONS.drop).toFixed(2) + "px)";
          maxValue = Math.max(maxValue, value);
        });
        root.dataset.dockMax = maxValue.toFixed(2);
        if (!moving) {
          dirty = false;
          if (items.every(function (state) { return state.target === 0; })) root.dataset.dockState = "idle";
        }
      }
      frame = requestAnimationFrame(draw);
    }

    function onPointerMove(event) { setTargets(event.clientX); }
    function onWindowPointerMove(event) {
      if (!pointerActive) return;
      var rootRect = root.getBoundingClientRect();
      var itemRects = items.map(function (state) { return state.element.getBoundingClientRect(); });
      var bottom = Math.max.apply(Math, [rootRect.bottom].concat(itemRects.map(function (rect) { return rect.bottom; })));
      var outside = event.clientX < rootRect.left || event.clientX > rootRect.right || event.clientY < rootRect.top || event.clientY > bottom;
      if (outside) reset();
    }
    function onFocusIn(event) {
      var item = event.target && event.target.closest ? event.target.closest("[data-dock-item]") : null;
      if (item) focusItem(item);
    }
    function onFocusOut() {
      requestAnimationFrame(function () {
        if (!root.contains(document.activeElement)) reset();
      });
    }
    function onKeyDown(event) {
      var item = event.target && event.target.closest ? event.target.closest("[data-dock-item]") : null;
      if (item && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        item.click();
      }
    }
    function onClick(event) {
      var item = event.target && event.target.closest ? event.target.closest("[data-dock-item]") : null;
      if (item) {
        items.forEach(function (state) {
          state.element.setAttribute("aria-pressed", state.element === item ? "true" : "false");
        });
      }
      reset();
    }

    var resizeObserver = new ResizeObserver(measure);
    resizeObserver.observe(root.parentElement || root);
    root.addEventListener("pointermove", onPointerMove);
    root.addEventListener("pointerleave", reset);
    root.addEventListener("focusin", onFocusIn);
    root.addEventListener("focusout", onFocusOut);
    root.addEventListener("keydown", onKeyDown);
    root.addEventListener("click", onClick);
    window.addEventListener("pointermove", onWindowPointerMove, { passive: true });
    reducedQuery.addEventListener("change", measure);
    precisionQuery.addEventListener("change", measure);
    measure();
    frame = requestAnimationFrame(draw);

    return function destroy() {
      cancelAnimationFrame(frame);
      resizeObserver.disconnect();
      root.removeEventListener("pointermove", onPointerMove);
      root.removeEventListener("pointerleave", reset);
      root.removeEventListener("focusin", onFocusIn);
      root.removeEventListener("focusout", onFocusOut);
      root.removeEventListener("keydown", onKeyDown);
      root.removeEventListener("click", onClick);
      window.removeEventListener("pointermove", onWindowPointerMove);
      reducedQuery.removeEventListener("change", measure);
      precisionQuery.removeEventListener("change", measure);
    };
  }

  createTopDockController(document.querySelector(".animated-top-dock__nav"));
})();
</script>
