<!--
  Vanguard Dimensional — dimensional architecture field, layered planes.
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License.
  Stripped: Vanguard Labs marketing copy/nav/CTA buttons, Google Fonts link, Tailwind CDN
  and utility classes (rebuilt as plain CSS), Iconify icons, GSAP + ScrollTrigger CDN
  (scroll reveal replaced with a simple fade-in on load), and the theme-toggle switch UI
  (kept the underlying colour-tween behaviour as a hover-triggered accent shift instead).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanguard Dimensional</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #e5e5e5;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  #webgl-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -30;
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: -20;
    pointer-events: none;
    opacity: 0.06;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.8) 0, rgba(255,255,255,0.8) 1px, transparent 1px, transparent 56px);
  }

  .grain-overlay {
    position: fixed;
    inset: 0;
    z-index: -10;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: 0.15;
    background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');
  }

  main {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vh 6vw;
    z-index: 10;
    pointer-events: none;
  }

  .content {
    max-width: 640px;
    pointer-events: auto;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .content.in { opacity: 1; transform: translateY(0); }

  .eyebrow {
    display: inline-block;
    margin-bottom: 1.5rem;
    padding: 0.4rem 1rem;
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.03em;
    color: #67e8f9;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(0,255,204,0.12), rgba(112,0,255,0.12));
    backdrop-filter: blur(4px);
  }

  h1 {
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 0 0 2rem 0;
    color: #fff;
  }
  h1 strong {
    font-weight: 600;
  }
  .grad-light {
    background: linear-gradient(120deg, #F3F4F6, #9CA3AF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .grad-accent {
    background: linear-gradient(120deg, #00FFCC, #7000FF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.lede {
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.7;
    max-width: 30rem;
    color: #9ca3af;
    margin: 0;
  }

  .hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 2rem 6vw;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .hud.in { opacity: 1; }

  .vector-line {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    color: #6b7280;
  }
  #coord-display {
    color: rgba(103, 232, 249, 0.85);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .accent-hint {
    margin-top: 1.25rem;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6b7280;
  }

  .descend {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .descend span {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    color: #6b7280;
    writing-mode: vertical-rl;
  }
  .scroll-track {
    width: 1px;
    height: 3.5rem;
    background: #1f2937;
    position: relative;
    overflow: hidden;
  }
  .scroll-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, transparent, #22d3ee, transparent);
    animation: scrollDrop 2.2s ease-in-out infinite;
  }
  @keyframes scrollDrop {
    0% { transform: translateY(-100%); opacity: 1; }
    100% { transform: translateY(150%); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="grain-overlay"></div>

<main>
  <div class="content" id="content">
    <span class="eyebrow">Dimensional Core v4.5</span>

    <h1>
      <strong>Immersive environments,</strong><br>
      <strong>engineered with</strong>
      <strong class="grad-light">absolute</strong>
      <strong class="grad-accent">precision.</strong>
    </h1>

    <p class="lede">
      A boundary-pushing, physics-enabled digital topology that merges layered
      WebGL glass with a shifting field of coloured noise.
    </p>
    <div class="accent-hint">Hover the canvas to shift the palette</div>
  </div>
</main>

<div class="hud" id="hud">
  <div class="vector-line">
    Vector // <span id="coord-display">0.0000, 0.0000</span>
  </div>
  <div class="descend">
    <span>Descend</span>
    <div class="scroll-track">
      <div class="scroll-line"></div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('webgl-canvas');
  const coordDisplay = document.getElementById('coord-display');

  const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,
    antialias: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 12;

  const uniforms = {
    u_time: { value: 0 },
    u_resolution: { value: new THREE.Vector2() },
    u_color1: { value: new THREE.Color(0.0, 0.8, 0.7) }, // Cyan
    u_color2: { value: new THREE.Color(0.4, 0.0, 0.9) }  // Deep purple
  };

  const snoiseLogic = `
    vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
    float snoise(vec2 v){
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy) );
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1;
        i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod(i, 289.0);
        vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m ; m = m*m ;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
    }
  `;

  // --- Background shader plane ---
  const bgMaterial = new THREE.ShaderMaterial({
    vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec3 u_color1;
      uniform vec3 u_color2;
      ${snoiseLogic}
      void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          uv.x *= u_resolution.x / u_resolution.y;

          vec3 baseColor = vec3(0.02, 0.02, 0.03);
          vec2 st = uv * 0.5;
          st += vec2(snoise(st + u_time * 0.04), snoise(st - u_time * 0.04)) * 0.4;

          float beam = smoothstep(0.2, 0.9, snoise(vec2(st.x + st.y * 2.0 - u_time * 0.1, u_time * 0.03)));
          vec3 glow = mix(u_color1, u_color2, snoise(uv * 2.0 + u_time * 0.15) * 0.5 + 0.5);

          float dist = distance(gl_FragCoord.xy / u_resolution.xy, vec2(0.5));
          float vignette = smoothstep(1.5, 0.1, dist);

          vec3 edgeColor = vec3(0.01, 0.01, 0.015);
          vec3 colorGlow = mix(baseColor, glow, beam * 0.6);

          gl_FragColor = vec4(mix(edgeColor, colorGlow, vignette), 1.0);
      }
    `,
    uniforms,
    depthWrite: false,
    depthTest: false
  });

  const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
  bgMesh.position.z = -15;
  scene.add(bgMesh);

  // --- Glass sphere shader ---
  const glassMaterial = new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vNormal;
      void main() {
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec3 u_color1;
      uniform vec3 u_color2;
      varying vec3 vNormal;
      ${snoiseLogic}
      void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          uv += vNormal.xy * 0.2;
          uv.x *= u_resolution.x / u_resolution.y;

          vec3 baseColor = vec3(0.04, 0.04, 0.06);
          vec2 st = uv * 0.6;
          st += vec2(snoise(st + u_time * 0.06), snoise(st - u_time * 0.06)) * 0.35;

          float beam = smoothstep(0.1, 0.9, snoise(vec2(st.x + st.y * 1.8 - u_time * 0.12, u_time * 0.02)));
          vec3 glow = mix(u_color1, u_color2, snoise(uv * 1.8 + u_time * 0.12) * 0.5 + 0.5);

          float fresnel = dot(vec3(0.0, 0.0, 1.0), vNormal);
          fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
          fresnel = pow(fresnel, 2.5);

          vec3 finalColor = mix(baseColor, glow, clamp((beam * 0.5) + (fresnel * 0.8), 0.0, 1.0));
          gl_FragColor = vec4(finalColor, 0.95);
      }
    `,
    uniforms,
    transparent: true
  });

  const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
  const spheres = [];

  const sphereData = [
    { scale: 4.2, x: 6.5, y: -1.2, z: -1.5, speed: 0.002 },
    { scale: 1.8, x: -6.0, y: -4.0, z: 2.5, speed: 0.004 },
    { scale: 1.1, x: -4.5, y: 4.2, z: -2.0, speed: 0.005 },
    { scale: 0.75, x: 3.0, y: 5.5, z: 4.0, speed: 0.008 }
  ];

  sphereData.forEach(data => {
    const mesh = new THREE.Mesh(sphereGeo, glassMaterial);
    mesh.scale.set(data.scale, data.scale, data.scale);
    mesh.position.set(data.x, data.y, data.z);
    scene.add(mesh);
    spheres.push({
      mesh,
      baseY: data.y,
      speed: data.speed,
      offset: Math.random() * Math.PI * 2
    });
  });

  // --- Viewport dynamics ---
  let mouseX = 0, mouseY = 0;
  let windowHalfX = window.innerWidth / 2;
  let windowHalfY = window.innerHeight / 2;

  document.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX - windowHalfX);
    mouseY = (event.clientY - windowHalfY);
    if (coordDisplay) {
      coordDisplay.innerText = `${(event.clientX / window.innerWidth).toFixed(4)}, ${(event.clientY / window.innerHeight).toFixed(4)}`;
    }
  });

  const resize = () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    windowHalfX = width / 2;
    windowHalfY = height / 2;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    const dist = camera.position.z - bgMesh.position.z;
    const vFov = camera.fov * Math.PI / 180;
    const planeHeight = 2 * Math.tan(vFov / 2) * dist;
    bgMesh.scale.set(planeHeight * camera.aspect / 2, planeHeight / 2, 1);

    uniforms.u_resolution.value.set(width, height);
  };

  window.addEventListener('resize', resize);
  resize();

  // --- Colour shift on hover (replaces the original theme-toggle switch) ---
  let target1 = { r: 0.0, g: 0.8, b: 0.7 };
  let target2 = { r: 0.4, g: 0.0, b: 0.9 };
  let hovered = false;

  canvas.style.pointerEvents = 'auto';
  document.body.addEventListener('mouseenter', () => {
    hovered = true;
    target1 = { r: 1.0, g: 0.0, b: 0.5 };
    target2 = { r: 1.0, g: 0.3, b: 0.0 };
  });
  document.body.addEventListener('mouseleave', () => {
    hovered = false;
    target1 = { r: 0.0, g: 0.8, b: 0.7 };
    target2 = { r: 0.4, g: 0.0, b: 0.9 };
  });

  const lerpColor = (c, t, amt) => {
    c.r += (t.r - c.r) * amt;
    c.g += (t.g - c.g) * amt;
    c.b += (t.b - c.b) * amt;
  };

  const clock = new THREE.Clock();
  const animate = () => {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    uniforms.u_time.value = time;

    lerpColor(uniforms.u_color1.value, target1, 0.02);
    lerpColor(uniforms.u_color2.value, target2, 0.02);

    camera.position.x += (mouseX * 0.005 - camera.position.x) * 0.05;
    camera.position.y += (-mouseY * 0.005 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);

    spheres.forEach(s => {
      s.mesh.position.y = s.baseY + Math.sin(time * s.speed * 120 + s.offset) * 0.5;
      s.mesh.rotation.x = time * s.speed * 18;
      s.mesh.rotation.y = time * s.speed * 24;
    });

    renderer.render(scene, camera);
  };

  animate();

  // Fade in overlay content once ready.
  requestAnimationFrame(() => {
    document.getElementById('content').classList.add('in');
    document.getElementById('hud').classList.add('in');
  });
})();
</script>

</body>
</html>
