<!--
  Shader Buttons
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Source: src/shaders/shader-buttons/ (ShaderButtons.tsx), which switches between six button
  variants defined in src/shaders/neuform-isolated/NeuformIsolatedEffects.tsx. This page collects
  all six as one set: Star Portal (imaginie-starfield.html), Ignition (ignition-terminal.html),
  Induction (valence-core.html), Plasma (aetheris-labs.html), Tactile (nexus-tactile.html) and
  Uploading (uploading-button.html).
  Stripped from every source: Tailwind CDN scaffolding (converted to hand-written CSS), GSAP
  (replaced with plain CSS/requestAnimationFrame), Iconify icon script, Google Fonts links
  (replaced with the system font stack), remote video/image assets, and all marketing copy,
  headers, footers and fictional product branding — only the shader/canvas button itself and
  its immediate card survive.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shader Buttons</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --panel: #101218;
    --panel-line: rgba(255,255,255,0.07);
    --ink: #e8eaf0;
    --ink-dim: #8b8f9c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    padding: clamp(24px, 5vw, 56px);
  }
  header {
    max-width: 1100px;
    margin: 0 auto 40px;
  }
  h1 {
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  header p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 0.95rem;
    max-width: 640px;
    line-height: 1.5;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 20px;
  }
  .card canvas.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .card-label {
    position: relative;
    z-index: 1;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .card-hint {
    position: relative;
    z-index: 1;
    font-size: 0.78rem;
    color: var(--ink-dim);
    text-align: center;
    max-width: 260px;
    line-height: 1.45;
  }

  /* ---- Star Portal: CSS holographic pill button ---- */
  .holo-btn {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: #0d0a12;
    background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(240,220,205,0.95) 50%, rgba(220,240,255,0.95) 100%);
    box-shadow: 0 0 20px rgba(255,255,255,0.15), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  .holo-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 30px rgba(255,220,180,0.35), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  /* ---- Shared shader-button chrome ---- */
  .shader-btn {
    position: relative;
    z-index: 1;
    display: block;
    width: 230px;
    height: 68px;
    border: 0;
    padding: 0;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    background: #0a0a0e;
    outline: none;
    transition: transform 220ms cubic-bezier(.34,1.4,.5,1), box-shadow 220ms ease;
  }
  .shader-btn:hover { transform: translateY(-2px); }
  .shader-btn:active { transform: translateY(1px) scale(0.985); }
  .shader-btn canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .shader-btn span {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    pointer-events: none;
  }
  #btn-ignite { box-shadow: 0 18px 36px rgba(15,12,10,.35), inset 0 1px 0 rgba(255,255,255,.1); }
  #btn-ignite span { color: #fdf6ee; text-shadow: 0 0 14px rgba(255,170,100,.55), 0 1px 6px rgba(0,0,0,.9); }
  #btn-induct { box-shadow: 0 18px 36px rgba(4,20,26,.4); }
  #btn-induct span { color: #e0f7f8; text-shadow: 0 0 12px rgba(0,210,255,.6), 0 1px 4px rgba(0,0,0,.8); }
  #btn-plasma { box-shadow: 0 18px 36px rgba(4,98,126,.25); }
  #btn-plasma span { color: #e2f1ff; text-shadow: 0 1px 12px rgba(0,16,40,.85); }
  #btn-surge { box-shadow: 0 18px 36px rgba(4,24,36,.35); }
  #btn-surge span { color: #e0faff; text-shadow: 0 1px 10px rgba(0,18,25,.85); }

  /* ---- Uploading: canvas-only microinteraction, no chrome needed ---- */
  .upload-stage {
    position: relative;
    z-index: 1;
    width: min(100%, 260px);
    aspect-ratio: 1 / 1;
  }
  .upload-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    .card canvas.bg, .shader-btn canvas { opacity: 0.9; }
  }
</style>
</head>
<body>

<header>
  <h1>Shader buttons</h1>
  <p>Six self-animating button treatments, each driven by its own tiny WebGL or canvas program. Hover or click any of them.</p>
</header>

<main>

  <!-- 1. Star Portal — CSS holographic button over a drifting starfield canvas -->
  <section class="card" data-name="star-portal">
    <canvas class="bg" id="bg-portal"></canvas>
    <div class="card-label">Star Portal</div>
    <a href="javascript:void(0)" class="holo-btn">Begin the journey</a>
  </section>

  <!-- 2. Ignition — warm ring of orbiting sparks that flare on hover -->
  <section class="card" data-name="ignition">
    <canvas class="bg" id="bg-ignite"></canvas>
    <div class="card-label">Ignition</div>
    <button type="button" class="shader-btn" id="btn-ignite">
      <canvas id="gl-ignite"></canvas>
      <span>Launch</span>
    </button>
  </section>

  <!-- 3. Induction — cyan electrical arcs around a plate, more arcs on hover -->
  <section class="card" data-name="induction">
    <canvas class="bg" id="bg-induct"></canvas>
    <div class="card-label">Induction</div>
    <button type="button" class="shader-btn" id="btn-induct">
      <canvas id="gl-induct"></canvas>
      <span>Valence core</span>
    </button>
  </section>

  <!-- 4. Plasma — churning nebula fill that heats up on hover, flashes on click -->
  <section class="card" data-name="plasma">
    <canvas class="bg" id="bg-plasma"></canvas>
    <div class="card-label">Plasma</div>
    <button type="button" class="shader-btn" id="btn-plasma">
      <canvas id="gl-plasma"></canvas>
      <span>Aether drive</span>
    </button>
  </section>

  <!-- 5. Tactile — a liquid surface that sloshes and tilts as the pointer sweeps it -->
  <section class="card" data-name="tactile">
    <canvas class="bg" id="bg-surge"></canvas>
    <div class="card-label">Tactile</div>
    <button type="button" class="shader-btn" id="btn-surge">
      <canvas id="gl-surge"></canvas>
      <span>Surge</span>
    </button>
  </section>

  <!-- 6. Uploading — a comet of light chasing round a plate, sweeping the label -->
  <section class="card" data-name="uploading">
    <div class="card-label">Uploading</div>
    <div class="upload-stage" id="stage-upload">
      <canvas id="c-upload"></canvas>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ shared WebGL quad helper ============ */
  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var NOISE_LIB = [
    'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}',
    'float noise(vec2 p){',
    '  vec2 i=floor(p), f=fract(p);',
    '  vec2 u=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),',
    '             mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);',
    '}'
  ].join('\n');

  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('shader compile failed:', gl.getShaderInfoLog(s));
    }
    return s;
  }

  function makeQuad(canvas, fsSource, uniformNames) {
    var gl = canvas.getContext('webgl', { alpha: false, antialias: true });
    if (!gl) return null;
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var locP = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(locP);
    gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

    var uniforms = { u_res: gl.getUniformLocation(prog, 'u_res') };
    (uniformNames || []).forEach(function (n) { uniforms[n] = gl.getUniformLocation(prog, n); });

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
    }
    window.addEventListener('resize', resize);
    resize();

    return { gl: gl, uniforms: uniforms, resize: resize };
  }

  /* ============ 1. Star Portal: drifting card-background starfield ============ */
  (function () {
    var canvas = document.getElementById('bg-portal');
    var ctx = canvas.getContext('2d');
    var stars = [], w = 0, h = 0;

    function resize() {
      var rect = canvas.getBoundingClientRect();
      w = canvas.width = rect.width;
      h = canvas.height = rect.height;
      stars = [];
      for (var i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.4 + 0.4,
          speed: Math.random() * 0.15 + 0.05,
          angle: Math.random() * Math.PI * 2,
          pulse: Math.random() * 0.02
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();

    var colors = ['rgba(230,194,158,', 'rgba(244,244,246,', 'rgba(173,140,255,', 'rgba(135,206,250,'];
    function draw() {
      ctx.clearRect(0, 0, w, h);
      stars.forEach(function (s, i) {
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        if (s.x < 0 || s.x > w) s.angle = Math.PI - s.angle;
        if (s.y < 0 || s.y > h) s.angle = -s.angle;
        var alpha = 0.3 + Math.abs(Math.sin(Date.now() * s.pulse)) * 0.7;
        var col = colors[i % colors.length];
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = col + alpha + ')';
        ctx.shadowBlur = s.r * 4;
        ctx.shadowColor = col + '0.8)';
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();

  /* ============ 2. Ignition: warm plate, orbiting spark arcs on hover, flash on click ============ */
  (function () {
    var btn = document.getElementById('btn-ignite');
    var canvas = document.getElementById('gl-ignite');
    var FS = [
      'precision highp float;',
      'uniform vec2 u_res; uniform float u_time; uniform float u_warp; uniform float u_flash;',
      NOISE_LIB,
      'float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.07+vec2(13.1,5.7); a*=0.5; } return v; }',
      'void main(){',
      '  vec2 sc = gl_FragCoord.xy / u_res;',
      '  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;',
      '  float r = length(uv); float rr = max(r, 0.08);',
      '  float a = atan(uv.y, uv.x); float t = u_time;',
      '  vec3 col = vec3(0.012, 0.011, 0.014);',
      '  float hz = fbm(uv * 2.6 + vec2(t * 0.35, 1.7));',
      '  col += vec3(0.13, 0.06, 0.032) * hz * (0.7 + 0.6 * u_warp);',
      '  for (int i = 0; i < 3; i++) {',
      '    float fi = float(i); float ringN = 26.0 + fi * 9.0;',
      '    vec2 sp = vec2((a / 6.28318 + 0.5) * ringN, (0.3 + fi * 0.22) / rr + t * (2.0 + fi * 1.2));',
      '    vec2 cell = floor(sp); vec2 f = fract(sp);',
      '    float h = hash(cell + fi * 17.31); float on = step(0.68, h);',
      '    vec2 c = vec2(0.2 + 0.6 * hash(cell + 4.7), 0.5); vec2 dlt = f - c;',
      '    float sy = mix(130.0, 8.0, u_warp);',
      '    float star = on * exp(-(dlt.x * dlt.x * 150.0 + dlt.y * dlt.y * sy));',
      '    float tw = 0.7 + 0.3 * sin(h * 81.0 + t * 9.0); tw = mix(tw, 1.0, u_warp);',
      '    vec3 sCol = mix(vec3(1.0, 0.94, 0.85), vec3(1.0, 0.6, 0.33), step(0.9, h));',
      '    float fade = smoothstep(0.02, 0.25, r);',
      '    col += sCol * star * tw * fade * (1.1 + 0.7 * u_warp);',
      '  }',
      '  col += vec3(1.0, 0.8, 0.58) * u_warp * 0.32 * exp(-r * 4.0);',
      '  vec2 e = sc * (1.0 - sc); col *= 0.3 + 0.7 * pow(e.x * e.y * 16.0, 0.3);',
      '  col = mix(col, vec3(1.0, 0.97, 0.92), clamp(u_flash, 0.0, 1.0));',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');
    var q = makeQuad(canvas, FS, ['u_time', 'u_warp', 'u_flash']);
    if (!q) return;
    var warp = 0, warpTarget = 0, flash = 0, z = 0, last = performance.now();
    btn.addEventListener('mouseenter', function () { warpTarget = 1; });
    btn.addEventListener('mouseleave', function () { warpTarget = 0; });
    btn.addEventListener('focus', function () { warpTarget = 1; });
    btn.addEventListener('blur', function () { warpTarget = 0; });
    btn.addEventListener('click', function () { flash = 1; warp = 0; z = 0; });
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      warp += (warpTarget - warp) * Math.min(1, dt * 2.6);
      flash *= Math.exp(-4.5 * dt);
      z += dt * (0.05 + warp * 1.35);
      q.resize();
      q.gl.uniform2f(q.uniforms.u_res, canvas.width, canvas.height);
      q.gl.uniform1f(q.uniforms.u_time, reduced ? 4.0 : z);
      q.gl.uniform1f(q.uniforms.u_warp, warp);
      q.gl.uniform1f(q.uniforms.u_flash, flash);
      q.gl.drawArrays(q.gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* matching warm ambient card background */
    var bgCanvas = document.getElementById('bg-ignite');
    var bg = makeQuad(bgCanvas, [
      'precision highp float; uniform vec2 u_res; uniform float u_time;', NOISE_LIB,
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / u_res;',
      '  float n = noise(uv * 2.5 + vec2(u_time * 0.015, u_time * 0.025));',
      '  n += noise(uv * 5.0 - vec2(u_time * 0.01, u_time * 0.02)) * 0.5;',
      '  vec3 col1 = vec3(0.055, 0.045, 0.04); vec3 col2 = vec3(0.03, 0.025, 0.03);',
      '  gl_FragColor = vec4(mix(col1, col2, n * 0.6 + 0.2), 1.0);',
      '}'
    ].join('\n'), ['u_time']);
    if (bg) (function loop(now) {
      bg.resize();
      bg.gl.uniform2f(bg.uniforms.u_res, bgCanvas.width, bgCanvas.height);
      bg.gl.uniform1f(bg.uniforms.u_time, now / 1000);
      bg.gl.drawArrays(bg.gl.TRIANGLES, 0, 3);
      requestAnimationFrame(loop);
    })(0);
  })();

  /* ============ 3. Induction: cyan arcs around a plate, more arcs on hover ============ */
  (function () {
    var btn = document.getElementById('btn-induct');
    var canvas = document.getElementById('gl-induct');
    var FS = [
      'precision highp float;',
      'uniform vec2 u_res; uniform float u_time; uniform float u_arcs; uniform float u_flash;',
      NOISE_LIB,
      'float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.05+vec2(9.7,3.1); a*=0.5; } return v; }',
      'float sdRBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }',
      'void main(){',
      '  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;',
      '  float ar = u_res.x / u_res.y;',
      '  vec2 hs = vec2(ar * 0.5 - 0.2, 0.5 - 0.2);',
      '  float d = sdRBox(p, hs, 0.14); float t = u_time;',
      '  float hover = clamp(u_arcs / 6.0, 0.0, 1.0);',
      '  vec3 col = vec3(0.039, 0.039, 0.039);',
      '  float plate = 1.0 - smoothstep(-0.004, 0.004, d);',
      '  vec3 plateCol = vec3(0.04, 0.05, 0.055);',
      '  plateCol += vec3(0.014, 0.022, 0.035) * fbm(p * 9.0);',
      '  plateCol += vec3(0.0, 0.25, 0.3) * exp(d * 9.0) * (0.25 + hover * 0.6);',
      '  col = mix(col, plateCol, plate);',
      '  col *= 1.0 + 0.5 * exp(-max(d, 0.0) * 16.0) * (1.0 - plate);',
      '  float a = atan(p.y, p.x); vec3 arcCol = vec3(0.0);',
      '  for (int i = 0; i < 6; i++) {',
      '    float fi = float(i); float w = clamp(u_arcs - fi, 0.0, 1.0);',
      '    float n1 = fbm(vec2(a * 2.4 + fi * 11.3, t * (1.6 + fi * 0.27) + fi * 53.1));',
      '    float off = (n1 - 0.5) * (0.11 + u_flash * 0.1);',
      '    float seg = smoothstep(0.35, 0.75, noise(vec2(a * 1.8 + fi * 7.7, t * (0.9 + fi * 0.13) + fi * 19.0)));',
      '    seg = 0.3 + 0.7 * seg;',
      '    float g = 0.0042 / (abs(d + off) + 0.006);',
      '    arcCol += (vec3(0.0, 0.75, 0.9) * g + vec3(0.6, 1.0, 0.95) * g * g * 0.55) * w * seg;',
      '  }',
      '  float outerMask = 1.0 - smoothstep(0.04, 0.15, d);',
      '  col += arcCol * (0.6 + 0.4 * hover) * outerMask;',
      '  float ring = 0.006 / (abs(d) + 0.006);',
      '  col += vec3(0.8, 0.98, 1.0) * ring * u_flash * 1.5 * outerMask;',
      '  col += vec3(0.7, 0.95, 1.0) * u_flash * 0.16 * outerMask;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');
    var q = makeQuad(canvas, FS, ['u_time', 'u_arcs', 'u_flash']);
    if (!q) return;
    var arcs = 2.4, arcsTarget = 2.4, flash = 0, crawl = 0, last = performance.now();
    btn.addEventListener('mouseenter', function () { arcsTarget = 5.8; });
    btn.addEventListener('mouseleave', function () { arcsTarget = 2.4; });
    btn.addEventListener('focus', function () { arcsTarget = 5.8; });
    btn.addEventListener('blur', function () { arcsTarget = 2.4; });
    btn.addEventListener('click', function () { flash = 1; });
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      arcs += (arcsTarget - arcs) * Math.min(1, dt * 5);
      flash *= Math.exp(-3.6 * dt);
      crawl += dt * (0.6 + (arcs / 6) * 1.1 + flash * 2.0);
      q.resize();
      q.gl.uniform2f(q.uniforms.u_res, canvas.width, canvas.height);
      q.gl.uniform1f(q.uniforms.u_time, reduced ? 3.0 : crawl);
      q.gl.uniform1f(q.uniforms.u_arcs, arcs);
      q.gl.uniform1f(q.uniforms.u_flash, flash);
      q.gl.drawArrays(q.gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    var bgCanvas = document.getElementById('bg-induct');
    var bg = makeQuad(bgCanvas, [
      'precision highp float; uniform vec2 u_res; uniform float u_time;', NOISE_LIB,
      'float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.05+vec2(9.7,3.1); a*=0.5; } return v; }',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / u_res.y; float t = u_time * 0.1;',
      '  float n1 = fbm(uv * 1.5 + vec2(t * 0.2, t * 0.1));',

  /* ============ 6. Uploading: canvas-2D light comet chasing a rounded plate ============ */

      plate(ctx);
      label(ctx, ph);
    }

    var now = 0, playing = true, last = null;
    function frame(ts){
      if(playing){
        if(last != null) now = (now + (ts-last)/1000) % DUR;
        last = ts;
        render(now);
      }else last = ts;
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    if(window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage-upload'));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitText(); render(now); });
    resize();
    requestAnimationFrame(frame);
  })();

})();
</script>
</body>
</html>
