<!--
  Gradient CTA
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN + utility classes (rewritten as plain CSS), the Lucide "send" icon markup left as inline SVG,
  marketing copy/button label replaced with a neutral placeholder, the auto-sizing/centring script (replaced with
  simple CSS centring), and the nested duplicate <html> wrapper from the source demo shell.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient CTA</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #12100d;
    color: #000;
  }

  .cta {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 2rem;
    border: none;
    border-radius: 9999px;
    font-size: 1rem;
    font-weight: 500;
    color: #6b3d00;
    cursor: pointer;
    background: linear-gradient(90deg, #FFEBB1, #FFC438);
    box-shadow:
      0 15px 33px -12px rgba(255, 162, 42, 0.9),
      inset 0 4px 6.3px rgba(252, 220, 134, 1),
      inset 0 -5px 6.3px rgba(255, 162, 38, 1);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .cta:hover {
    box-shadow:
      0 15px 33px -12px rgba(255, 162, 42, 0.5),
      inset 0 4px 6.3px rgba(252, 220, 134, 1),
      inset 0 -5px 6.3px rgba(255, 162, 38, 1);
    transform: translateY(-1px);
  }

  /* sheen sweep, driven by a translated pseudo-layer */
  .cta::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  .cta:hover::before {
    transform: translateY(0);
  }

  .cta__label {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .cta__icon {
    width: 1rem;
    height: 1rem;
    transition: transform 0.3s ease;
  }

  .cta:hover .cta__icon {
    transform: translate(2px, -2px);
  }

  /* idle shimmer: a soft highlight drifting across the gradient */
  .cta__shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0) 30%,
      rgba(255, 255, 255, 0.55) 48%,
      rgba(255, 255, 255, 0) 66%
    );
    background-size: 250% 100%;
    mix-blend-mode: soft-light;
    pointer-events: none;
  }
</style>
</head>
<body>
  <button class="cta" id="cta">
    <div class="cta__shimmer" id="shimmer"></div>
    <span class="cta__label">
      Get started
      <svg class="cta__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
        <path d="m21.854 2.147-10.94 10.939"/>
      </svg>
    </span>
  </button>

  <script>
    // plain rAF loop driving the idle shimmer sweep (no GSAP dependency)
    (function () {
      var shimmer = document.getElementById('shimmer');
      var start = null;
      var period = 3200; // ms per sweep cycle

      function frame(ts) {
        if (start === null) start = ts;
        var t = ((ts - start) % period) / period; // 0..1
        var pos = -50 + t * 150; // sweep from off-left to off-right
        shimmer.style.backgroundPosition = pos + '% 0';
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
