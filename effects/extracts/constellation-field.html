<!--
  Constellation Field
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN scaffolding, iconify-icon, GSAP + ScrollTrigger masked text reveal,
  nav/hero/logo marketing markup, remote Supabase avatar images, Google-font stack.
  Kept: the Canvas 2D constellation node/link field with pointer gravity (tech: CSS/Canvas,
  no WebGL or Three.js involved despite the source folder name).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constellation Field</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #070914;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(ellipse at center, #0E1222 0%, #070914 100%);
  }
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(to bottom, transparent 0%, rgba(14,18,34,0.4) 55%, #070914 100%);
    opacity: 0.8;
    pointer-events: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .label {
    position: fixed;
    left: 1.5rem;
    bottom: 1.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #5C668A;
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="veil"></div>
  <canvas id="constellationCanvas"></canvas>
  <div class="label">Constellation field</div>

  <script>
    const canvas = document.getElementById('constellationCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let nodes = [];
    const LINK = 160;
    let MAX_NODES = window.innerWidth < 768 ? 40 : 85;
    let pointer = { x: -1000, y: -1000 };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.max(1, Math.floor(width * dpr));
      canvas.height = Math.max(1, Math.floor(height * dpr));
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }

    function initNodes() {
      MAX_NODES = window.innerWidth < 768 ? 40 : 85;
      nodes = [];
      for (let i = 0; i < MAX_NODES; i++) {
        nodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          radius: Math.random() * 2.4 + 1.8
        });
      }
    }

    window.addEventListener('resize', () => {
      resize();
      initNodes();
    });

    document.addEventListener('mousemove', e => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });
    document.addEventListener('mouseleave', () => {
      pointer.x = -1000;
      pointer.y = -1000;
    });

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';

      ctx.strokeStyle = '#E6C879';
      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const d = dist(nodes[i], nodes[j]);
          if (d < LINK) {
            ctx.globalAlpha = 0.22 + (1 - d / LINK) * 0.55;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      nodes.forEach(node => {
        node.x += node.vx;
        node.y += node.vy;

        if (node.x < 0 || node.x > width) node.vx *= -1;
        if (node.y < 0 || node.y > height) node.vy *= -1;

        const pd = dist(node, pointer);
        if (pd < 220) {
          node.x -= (node.x - pointer.x) * 0.005;
          node.y -= (node.y - pointer.y) * 0.005;
        }

        const pulse = 0.78 + Math.sin(Date.now() * 0.001 + node.x) * 0.22;
        ctx.fillStyle = '#E6C879';
        ctx.globalAlpha = pulse * 0.28;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius * 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = pulse;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(animateCanvas);
    }

    resize();
    initNodes();

    animateCanvas();
  </script>
</body>
</html>
