<!--
  Orbital Sphere
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React component wrapper, TSX/TypeScript types, ResizeObserver/IntersectionObserver
  visibility plumbing, hue-rotate CSS hook, and the npm build pipeline; kept only the raw
  Three.js particle-sphere-and-orbits scene, rewritten as a plain requestAnimationFrame loop.
-->
<title>Orbital Sphere</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0512;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #label {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    color: rgba(230, 220, 245, 0.55);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
<div id="stage"><canvas id="canvas"></canvas></div>
<div id="label">Orbital Sphere</div>

<script src="three.min.js"></script>
<script>
(function () {
  var OPTIONS = {
    speed: 1,
    particleSize: 0.015,
    particleOpacity: 0.8,
    orbitOpacity: 0.25,
    scale: 1,
    haloOpacity: 0.2,
  };

  var canvas = document.getElementById("canvas");
  var stage = document.getElementById("stage");

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var networkGroup = new THREE.Group();
  scene.add(networkGroup);

  var radius = 2.2, particleCount = 15000;
  var positions = new Float32Array(particleCount * 3);
  var colors = new Float32Array(particleCount * 3);
  var colorBright = new THREE.Color(0xa78bfa);
  var colorDim = new THREE.Color(0x701a75);
  var validIndex = 0;

  for (var index = 0; index < particleCount; index += 1) {
    var phi = Math.acos(-1 + (2 * index) / particleCount);
    var theta = Math.sqrt(particleCount * Math.PI) * phi;
    var x = radius * Math.cos(theta) * Math.sin(phi);
    var y = radius * Math.sin(theta) * Math.sin(phi);
    var z = radius * Math.cos(phi);
    var noise = Math.sin(x * 3.5) * Math.cos(y * 3.5) * Math.sin(z * 3.5) + Math.cos(x * 6) * 0.4;
    if (noise <= -0.1) continue;
    var distortion = 1 + noise * 0.1;
    positions[validIndex * 3] = x * distortion;
    positions[validIndex * 3 + 1] = y * distortion;
    positions[validIndex * 3 + 2] = z * distortion;
    var mixedColor = colorDim.clone().lerp(colorBright, noise > 0.5 ? 1 : 0.3);
    colors[validIndex * 3] = mixedColor.r;
    colors[validIndex * 3 + 1] = mixedColor.g;
    colors[validIndex * 3 + 2] = mixedColor.b;
    validIndex += 1;
  }

  var particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions.slice(0, validIndex * 3), 3));
  particleGeometry.setAttribute("color", new THREE.BufferAttribute(colors.slice(0, validIndex * 3), 3));

  var particleMaterial = new THREE.PointsMaterial({
    size: 0.015,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  networkGroup.add(new THREE.Points(particleGeometry, particleMaterial));

  var orbitMaterial = new THREE.LineBasicMaterial({
    color: 0x8b5cf6,
    transparent: true,
    opacity: 0.25,
    blending: THREE.AdditiveBlending,
  });

  var orbitGeometries = [], nodeGeometries = [], nodeMaterials = [], haloMaterials = [];
  var responsiveScale = 1;

  for (var orbitIndex = 0; orbitIndex < 6; orbitIndex += 1) {
    var geometry = new THREE.BufferGeometry();
    var points = [];
    var orbitRadius = radius * (1.08 + Math.random() * 0.2);
    for (var point = 0; point <= 90; point += 1) {
      var angle = (point / 90) * Math.PI * 2;
      points.push(Math.cos(angle) * orbitRadius, Math.sin(angle) * orbitRadius, Math.sin(angle * 4) * 0.1);
    }
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
    orbitGeometries.push(geometry);
    var line = new THREE.Line(geometry, orbitMaterial);
    line.rotation.x = Math.random() * Math.PI * 2;
    line.rotation.y = Math.random() * Math.PI * 2;
    networkGroup.add(line);

    if (orbitIndex % 2 !== 0) {
      var nodeGeometry = new THREE.SphereGeometry(0.025, 16, 16);
      var nodeMaterial = new THREE.MeshBasicMaterial({ color: 0xd946ef });
      var node = new THREE.Mesh(nodeGeometry, nodeMaterial);
      var nodeAngle = Math.random() * Math.PI * 2;
      node.position.set(Math.cos(nodeAngle) * orbitRadius, Math.sin(nodeAngle) * orbitRadius, 0);
      line.add(node);

      var haloGeometry = new THREE.SphereGeometry(0.08, 16, 16);
      var haloMaterial = new THREE.MeshBasicMaterial({
        color: 0xc084fc,
        transparent: true,
        opacity: 0.2,
        blending: THREE.AdditiveBlending,
      });
      var halo = new THREE.Mesh(haloGeometry, haloMaterial);
      node.add(halo);

      nodeGeometries.push(nodeGeometry, haloGeometry);
      nodeMaterials.push(nodeMaterial, haloMaterial);
      haloMaterials.push(haloMaterial);
    }
  }

  function resize() {
    var width = stage.clientWidth, height = stage.clientHeight;
    camera.aspect = width / Math.max(1, height);
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
    if (width >= 1024) {
      networkGroup.position.set(2.5, 0, -2);
      responsiveScale = 1.15;
      camera.position.z = 5.5;
    } else {
      networkGroup.position.set(0, -1, -3);
      responsiveScale = 1;
      camera.position.z = 6.5;
    }
    networkGroup.scale.setScalar(responsiveScale * OPTIONS.scale);
  }

  function render() {
    particleMaterial.size = OPTIONS.particleSize;
    particleMaterial.opacity = OPTIONS.particleOpacity;
    orbitMaterial.opacity = OPTIONS.orbitOpacity;
    haloMaterials.forEach(function (material) { material.opacity = OPTIONS.haloOpacity; });
    networkGroup.scale.setScalar(responsiveScale * OPTIONS.scale);
    networkGroup.rotation.y += 0.0008 * OPTIONS.speed;
    networkGroup.rotation.x += 0.0003 * OPTIONS.speed;
    networkGroup.children.forEach(function (child, childIndex) {
      if (child.type === "Line") child.rotation.z += 0.0004 * OPTIONS.speed * (childIndex % 2 === 0 ? 1 : -1);
    });
    renderer.render(scene, camera);
  }

  function tick() {
    render();
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(tick);
})();
</script>
