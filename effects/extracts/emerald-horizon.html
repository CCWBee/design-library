<!--
  Emerald Horizon
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/TSX component wrapper, Three.js (OrthographicCamera + PlaneGeometry scaffolding
  replaced with a raw WebGL fullscreen-quad shader, since the effect is a single fragment shader
  and needs no scene graph), Tailwind class scaffolding, GSAP (unused), hue-rotate CSS filter prop.
  Kept: the original vertex/fragment shader source verbatim, all uniforms and their behaviour.
-->
<title>Emerald Horizon</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000502;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .label {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    color: rgba(180, 255, 210, 0.55);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
</style>

<canvas id="gl"></canvas>
<div class="label">Emerald Horizon</div>

<script>
(function () {
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    document.body.innerHTML = '<p style="color:#9fe; font:14px system-ui; padding:2rem;">WebGL is not available in this browser.</p>';
    return;
  }

  var vertexSource =
    'attribute vec2 a_position;' +
    'varying vec2 vUv;' +
    'void main() {' +
    '  vUv = a_position * 0.5 + 0.5;' +
    '  gl_Position = vec4(a_position, 0.0, 1.0);' +
    '}';

  // Fragment shader kept verbatim from the ThreeUI source (uniform names unchanged).
  var fragmentSource =
    'precision highp float;' +
    'uniform float u_time;' +
    'uniform vec2 u_resolution;' +
    'uniform float u_wave_scale;' +
    'uniform float u_variation;' +
    'uniform float u_glow;' +
    'uniform float u_vignette;' +
    'varying vec2 vUv;' +
    'float hash(float n) { return fract(sin(n) * 1e4); }' +
    'float noise(float x) {' +
    '  float i = floor(x);' +
    '  float f = fract(x);' +
    '  float u = f * f * (3.0 - 2.0 * f);' +
    '  return mix(hash(i), hash(i + 1.0), u);' +
    '}' +
    'void main() {' +
    '  vec2 st = gl_FragCoord.xy / u_resolution.xy;' +
    '  float yPos = st.y;' +
    '  float wave1 = sin(st.x * 3.0 + u_time * 0.5) * 0.1 * u_wave_scale;' +
    '  float wave2 = sin(st.x * 5.0 - u_time * 0.3) * 0.05 * u_wave_scale;' +
    '  float combinedWave = wave1 + wave2;' +
    '  float intensity = smoothstep(0.4, -0.1, yPos + combinedWave);' +
    '  float variation = noise(st.x * 2.0 + u_time * 0.1) * 0.5 + 0.5;' +
    '  intensity *= variation * 1.5 * u_variation;' +
    '  vec3 color = vec3(0.0, 0.02, 0.0);' +
    '  vec3 glowColor1 = vec3(0.05, 0.8, 0.2);' +
    '  vec3 glowColor2 = vec3(0.0, 1.0, 0.5);' +
    '  vec3 finalGlow = mix(glowColor1, glowColor2, st.x + sin(u_time * 0.2) * 0.5);' +
    '  color += finalGlow * pow(intensity, 1.5) * 1.2 * u_glow;' +
    '  float vignette = mix(1.0, smoothstep(1.2, 0.5, length(st - vec2(0.5, 0.0))), u_vignette);' +
    '  color *= vignette;' +
    '  gl_FragColor = vec4(color, 1.0);' +
    '}';

  function compile(type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  var vertexShader = compile(gl.VERTEX_SHADER, vertexSource);
  var fragmentShader = compile(gl.FRAGMENT_SHADER, fragmentSource);
  var program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return;
  }
  gl.useProgram(program);

  var quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  var positionLoc = gl.getAttribLocation(program, 'a_position');
  gl.enableVertexAttribArray(positionLoc);
  gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

  var uniforms = {
    time: gl.getUniformLocation(program, 'u_time'),
    resolution: gl.getUniformLocation(program, 'u_resolution'),
    waveScale: gl.getUniformLocation(program, 'u_wave_scale'),
    variation: gl.getUniformLocation(program, 'u_variation'),
    glow: gl.getUniformLocation(program, 'u_glow'),
    vignette: gl.getUniformLocation(program, 'u_vignette')
  };

  // Tunable parameters, mirroring the original component's props/defaults.
  var options = { speed: 1, waveScale: 1, variation: 1, glow: 1, vignette: 1 };

  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    var width = window.innerWidth;
    var height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
  }

  window.addEventListener('resize', resize);
  resize();

  var start = performance.now();
  var frame = 0;
  var visible = true;

  document.addEventListener('visibilitychange', function () {
    visible = !document.hidden;
    if (visible && !frame) frame = requestAnimationFrame(render);
  });

  function render(now) {
    gl.uniform1f(uniforms.time, (now - start) * 0.001 * options.speed);
    gl.uniform1f(uniforms.waveScale, options.waveScale);
    gl.uniform1f(uniforms.variation, options.variation);
    gl.uniform1f(uniforms.glow, options.glow);
    gl.uniform1f(uniforms.vignette, options.vignette);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    frame = visible ? requestAnimationFrame(render) : 0;
  }

  frame = requestAnimationFrame(render);
})();
</script>
