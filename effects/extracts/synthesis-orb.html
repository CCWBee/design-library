<!--
  Synthesis Orb
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License.
  Stripped/stubbed: Tailwind CDN, Iconify icons, Google Fonts and all product copy
  (converted to plain CSS + system font stack, generic labels); removed the two
  remote Supabase images and the remote looping video (right-hand card is now a
  flat CSS gradient block); dropped scroll-triggered IntersectionObserver reveals
  in favour of a one-shot CSS entrance so the scene animates at rest with no
  interaction required. The particle-orb canvas animation itself is untouched.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthesis Orb</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030303;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 4vw;
  }

  .stage {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 4vw, 3rem);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 9 / 19;
    border-radius: 2rem;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 40%, rgba(0,0,0,0) 100%);
    opacity: 0;
    transform: translateY(24px);
    filter: blur(6px);
    animation: reveal 1.1s ease-out forwards;
  }
  .card.two { animation-delay: 0.2s; }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .card-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    border-radius: calc(2rem - 1px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 2rem 1.6rem 2.4rem;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
  }

  .card-header {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "Courier New", monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .card-header .mark { opacity: 0.7; }

  /* Card one */
  .title-area {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 3rem;
  }
  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
    margin: 0;
  }
  .pixel-dissolve {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1px;
    width: 80%;
    margin-top: 0.5rem;
    opacity: 0.6;
  }

  #orbCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 60%;
    top: 25%;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.9;
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.2));
  }

  .card-footer {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: auto;
  }
  .card-footer h2 {
    font-family: "Courier New", monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    margin: 0;
  }
  .card-footer p {
    font-family: "Courier New", monospace;
    font-size: 8px;
    line-height: 1.8;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: justify;
    margin: 0;
  }

  /* Card two */
  .card-inner.two {
    align-items: center;
  }
  .title-area.two {
    margin-top: 3rem;
    width: 100%;
  }
  .glyph {
    margin-bottom: 0.75rem;
    opacity: 0.9;
  }
  .title-mono {
    font-family: "Courier New", monospace;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }
  .est {
    font-family: "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.5);
    margin-top: 1rem;
  }

  /* Neutral stand-in for the removed image/video panel */
  .panel-block {
    position: absolute;
    inset: 0;
    top: 30%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15), transparent 60%),
      linear-gradient(160deg, #1a1a1a 0%, #0a0a0a 70%);
  }
  .panel-block::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at center, #ffffff 0.5px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: multiply;
    opacity: 0.9;
  }
  .panel-block::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8) 50%);
    background-size: 100% 4px;
    mix-blend-mode: overlay;
    opacity: 0.3;
  }
  .panel-fade {
    position: absolute;
    inset: 0;
    top: 50%;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 0%, #0a0a0a 100%);
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Card 1: particle orb -->
  <div class="card one">
    <div class="card-inner">
      <div class="card-header">
        <span>Studio</span>
        <span class="mark">Reference</span>
      </div>
      <div class="title-area">
        <h1 class="title">Synthesis</h1>
        <div id="pixel-dissolve" class="pixel-dissolve"></div>
      </div>
      <canvas id="orbCanvas"></canvas>
      <div class="card-footer">
        <h2>Particle Field Study</h2>
        <p>A spherical point cloud rotates and jitters continuously, rendered on a plain 2D canvas with no external assets.</p>
      </div>
    </div>
  </div>

  <!-- Card 2: static composition, image/video swapped for a neutral gradient -->
  <div class="card two">
    <div class="card-inner two">
      <div class="card-header">
        <span>Studio</span>
        <span class="mark">Reference</span>
      </div>
      <div class="title-area two">
        <svg width="120" height="24" viewBox="0 0 120 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="glyph">
          <path d="M20 20C20 12 35 12 60 12C85 12 100 12 100 20" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M30 4C30 8 40 12 60 12C80 12 90 8 90 4" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M40 16C40 14 48 12 60 12C72 12 80 14 80 16" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
          <path d="M50 8C50 10 54 12 60 12C66 12 70 10 70 8" stroke="white" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <h1 class="title-mono">Synthesis</h1>
        <span class="est">Ref. panel</span>
      </div>
      <div class="panel-block"></div>
      <div class="panel-fade"></div>
    </div>
  </div>

</div>

<script>
  // Pixel dissolve twinkle
  (function () {
    var pixelContainer = document.getElementById('pixel-dissolve');
    for (var i = 0; i < 40; i++) {
      var pixel = document.createElement('div');
      var w = Math.random() > 0.8 ? 2 : (Math.random() > 0.9 ? 3 : 1);
      var h = Math.random() > 0.8 ? 2 : 1;
      pixel.style.width = (w * 2) + 'px';
      pixel.style.height = (h * 2) + 'px';
      pixel.style.backgroundColor = 'white';
      pixel.style.opacity = Math.random() * 0.8;
      pixel.style.margin = (Math.random() * 2) + 'px ' + (Math.random() * 3) + 'px';
      pixel.style.transition = 'opacity 1s ease-in-out';
      pixelContainer.appendChild(pixel);
      (function (p) {
        setInterval(function () {
          p.style.opacity = Math.random() * 0.8 + 0.1;
        }, 1000 + Math.random() * 2000);
      })(pixel);
    }
  })();

  // Simulated 3D particle orb on a plain 2D canvas
  (function () {
    var canvas = document.getElementById('orbCanvas');
    var ctx = canvas.getContext('2d');

    var width, height;
    var particles = [];
    var numParticles = 800;

    function resize() {
      var rect = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      width = canvas.width;
      height = canvas.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      width /= dpr;
      height /= dpr;
      initParticles();
    }

    function initParticles() {
      particles = [];
      var radius = Math.min(width, height) * 0.35;

      for (var i = 0; i < numParticles; i++) {
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos((Math.random() * 2) - 1);
        var r = radius + (Math.random() * radius * 0.4 - radius * 0.2);

        var x = r * Math.sin(phi) * Math.cos(theta);
        var y = r * Math.sin(phi) * Math.sin(theta);
        var z = r * Math.cos(phi);

        particles.push({
          x: x, y: y, z: z,
          originalX: x, originalY: y, originalZ: z,
          size: Math.random() * 1.5 + 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    var time = 0;
    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      time += 0.005;

      var cx = width / 2;
      var cy = height / 2;

      var rotY = time * 0.5;
      var rotX = time * 0.3;

      var cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      var cosX = Math.cos(rotX), sinX = Math.sin(rotX);

      particles.sort(function (a, b) { return b.z - a.z; });

      particles.forEach(function (p) {
        var jitter = Math.sin(time * 10 + p.phase) * 2;

        var x = p.originalX + jitter;
        var y = p.originalY;
        var z = p.originalZ;

        var tempX = x * cosY - z * sinY;
        var tempZ = z * cosY + x * sinY;
        x = tempX;
        z = tempZ;

        var tempY = y * cosX - z * sinX;
        tempZ = z * cosX + y * sinX;
        y = tempY;
        z = tempZ;

        var fov = 300;
        var zOffset = 400;
        var scale = fov / (fov + z + zOffset);

        var projX = x * scale + cx;
        var projY = y * scale + cy;
        var pSize = p.size * scale;
        var alpha = Math.max(0.1, Math.min(0.9, (z + 200) / 400));

        ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
        ctx.fillRect(projX, projY, pSize, pSize);
      });

      requestAnimationFrame(animateCanvas);
    }

    window.addEventListener('resize', resize);
    setTimeout(function () {
      resize();
      animateCanvas();
    }, 100);
  })();
</script>

</body>
</html>
