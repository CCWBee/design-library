<!--
  Gradient Pill Button
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN + utility classes (rewritten as plain CSS), Lucide icon data attributes,
  the wrapper's iframe auto-centering script, and the outer "Component Preview" scaffolding.
  Added: a slow animated gradient sweep across the fill and border so the "animated gradient fill"
  in the effect brief is a real animation rather than a static tint.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Pill Button</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #111318;
    color: #e5e7eb;
  }

  .pill {
    --border-gradient: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(0,0,0,0.4), rgba(255,255,255,0.8));
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 9999px;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #e5e7eb;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.20), rgba(255,255,255,0.10)),
                linear-gradient(120deg, #3a3f4a, #23262d, #3a3f4a);
    background-size: 100% 100%, 300% 300%;
    box-shadow:
      0 18px 35px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    animation: pill-sheen 6s ease-in-out infinite;
  }

  .pill:hover {
    transform: translateY(-1px);
    box-shadow:
      0 22px 42px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.10);
  }

  .pill:active {
    transform: translateY(0);
  }

  /* gradient border ring, matching the ThreeUI source's mask-composite trick */
  .pill::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: var(--border-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    background-size: 100% 200%;
    animation: pill-border-shift 6s ease-in-out infinite;
  }

  .pill svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: #9aa0aa;
  }

  @keyframes pill-sheen {
    0%   { background-position: 0% 0%, 0% 50%; }
    50%  { background-position: 0% 0%, 100% 50%; }
    100% { background-position: 0% 0%, 0% 50%; }
  }

  @keyframes pill-border-shift {
    0%   { background-position: 50% 0%; }
    50%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill, .pill::before {
      animation: none;
    }
  }
</style>
</head>
<body>
  <button class="pill">
    <span>Demo lesson</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"></path>
      <path d="m12 5 7 7-7 7"></path>
    </svg>
  </button>
</body>
</html>
