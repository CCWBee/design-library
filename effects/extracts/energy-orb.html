  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/TSX component wrapper, prop plumbing, Tailwind classes, and observer/visibility scaffolding; the raw-WebGL orb shader and Canvas2D star field are preserved with the authored default uniforms.
-->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Energy Orb</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #05030e;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #host {
    position: fixed;
    inset: 0;
    background: #05030e;
  }
  #host canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #stars { z-index: 0; }
  #shader { z-index: 1; }
</style>
</head>
<body>
<div id="host">
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="shader" aria-hidden="true"></canvas>
</div>

<script>
(function () {
  "use strict";

  // ---- Authored defaults (from ENERGY_ORB_DEFAULTS) ----
  var opt = {
    speed: 1,
    smokeScale: 1,
    smokeStrength: 1,
    smokeSpeed: 1,
    hue: 0,          // degrees
    saturation: 1,
    glow: 1,
    starDensity: 1,
    starSpeed: 1,
    starSize: 1
  };

  var VERT = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

  var FRAG = [
    "precision highp float;",
    "uniform float uT;uniform vec2 uR;",
    "uniform float uSmokeScale;uniform float uSmokeStrength;uniform float uSmokeSpeed;",
    "uniform float uHue;uniform float uSaturation;uniform float uGlow;",
    "float hash(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}",
    "float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);",
    " return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),",
    " mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}",
    "float fbm(vec3 p){float v=0.0;float a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec3(1.7);a*=0.5;}return v;}",
    "vec3 gradeColor(vec3 color){",
    " float luminance=dot(color,vec3(0.2126,0.7152,0.0722));",
    " color=mix(vec3(luminance),color,uSaturation);",
    " vec3 axis=normalize(vec3(1.0));",
    " return max(vec3(0.0),color*cos(uHue)+cross(axis,color)*sin(uHue)+axis*dot(axis,color)*(1.0-cos(uHue)));",
    "}",
    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-0.5*uR)/min(uR.x,uR.y);",
    " float r=length(uv);",
    " float R=0.31;",
    " vec3 col=vec3(0.0);float alpha=0.0;",
    " if(r<R){",
    "   float z=sqrt(R*R-r*r);",
    "   vec3 n=normalize(vec3(uv,z));",
    "   float ca=uT*0.15;",
    "   mat3 rot=mat3(cos(ca),0.,sin(ca),0.,1.,0.,-sin(ca),0.,cos(ca));",
    "   vec3 sp=rot*n;",
    "   float smokeTime=uT*uSmokeSpeed;",
    "   float f1=fbm(sp*(2.6*uSmokeScale)+vec3(0.0,smokeTime*0.12,0.0));",
    "   float f2=fbm(sp*(4.5*uSmokeScale)-vec3(smokeTime*0.08,0.0,smokeTime*0.05)+f1*1.8);",
    "   float veil=smoothstep(0.35,0.75,f2);",
    "   vec3 deep=vec3(0.04,0.02,0.12);",
    "   vec3 mid=vec3(0.22,0.16,0.55);",
    "   vec3 bright=vec3(0.62,0.60,0.98);",
    "   col=mix(deep,mid,f1*1.2);",
    "   col=mix(col,bright,clamp(veil*0.65*uSmokeStrength,0.0,1.0));",
    "   float fres=pow(1.0-z/R,2.2);",
    "   col+=vec3(0.55,0.55,1.0)*fres*1.1*uGlow;",
    "   float top=pow(max(dot(n,normalize(vec3(0.0,0.7,0.7))),0.0),3.0);",
    "   col+=vec3(0.45,0.42,0.9)*top*0.35*uGlow;",
    "   alpha=1.0;",
    " }",
    " float glow=exp(-(r-R)*14.0);",
    " if(r>=R){",
    "   glow=clamp(glow,0.0,1.0);",
    "   col=vec3(0.55,0.52,1.0)*glow*0.8*uGlow;",
    "   alpha=glow*0.85;",
    " } else {",
    "   float rim=smoothstep(R-0.03,R,r);",
    "   col+=vec3(0.6,0.58,1.0)*rim*0.6*uGlow;",
    " }",
    " col=gradeColor(col);",
    " gl_FragColor=vec4(col,alpha);",
    "}"
  ].join("\n");

  var host = document.getElementById("host");
  var starCanvas = document.getElementById("stars");
  var canvas = document.getElementById("shader");
  var starCtx = starCanvas.getContext("2d", { alpha: true });
  var gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false, antialias: true });

  if (!gl || !starCtx) {
    document.body.innerHTML = "<p style='color:#ccc;padding:2rem'>WebGL is not available in this browser.</p>";
    return;
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
    }
    return s;
  }

  var vertex = compile(gl.VERTEX_SHADER, VERT);
  var fragment = compile(gl.FRAGMENT_SHADER, FRAG);
  var program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || "program link failed");
  }
  gl.useProgram(program);

  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  var U = {
    time: gl.getUniformLocation(program, "uT"),
    resolution: gl.getUniformLocation(program, "uR"),
    smokeScale: gl.getUniformLocation(program, "uSmokeScale"),
    smokeStrength: gl.getUniformLocation(program, "uSmokeStrength"),
    smokeSpeed: gl.getUniformLocation(program, "uSmokeSpeed"),
    hue: gl.getUniformLocation(program, "uHue"),
    saturation: gl.getUniformLocation(program, "uSaturation"),
    glow: gl.getUniformLocation(program, "uGlow")
  };

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);

  // ---- Star field ----
  function seeded(index, salt) {
    return Math.abs(Math.sin(index * 91.173 + salt * 17.719) * 43758.5453) % 1;
  }
  function fract(v) { return v - Math.floor(v); }

  function createStars(count) {
    var arr = [];
    for (var i = 0; i < count; i++) {
      arr.push({
        x: seeded(i, 1),
        y: seeded(i, 2),
        depth: 0.25 + seeded(i, 3) * 0.75,
        phase: seeded(i, 4) * Math.PI * 2,
        drift: 0.35 + seeded(i, 5) * 0.65,
        size: 0.45 + seeded(i, 6) * 1.15
      });
    }
    return arr;
  }
  var stars = createStars(180);

  var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reducedMotion = motionQuery.matches;
  motionQuery.addEventListener("change", function (e) { reducedMotion = e.matches; });

  var width = 1, height = 1, starDpr = 1;
  var startedAt = performance.now();

  function resize() {
    var b = host.getBoundingClientRect();
    width = Math.max(1, b.width);
    height = Math.max(1, b.height);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var bw = Math.max(1, Math.round(width * dpr));
    var bh = Math.max(1, Math.round(height * dpr));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    gl.viewport(0, 0, bw, bh);
    gl.uniform2f(U.resolution, bw, bh);

    starDpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var sw = Math.max(1, Math.round(width * starDpr));
    var sh = Math.max(1, Math.round(height * starDpr));
    if (starCanvas.width !== sw || starCanvas.height !== sh) {
      starCanvas.width = sw;
      starCanvas.height = sh;
    }
  }

  function drawStars(elapsed) {
    starCtx.setTransform(1, 0, 0, 1, 0, 0);
    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    var density = Math.max(0, opt.starDensity);
    var count = Math.min(stars.length, Math.round((width * height / 4200) * density));
    if (!count) return;

    starCtx.setTransform(starDpr, 0, 0, starDpr, 0, 0);
    starCtx.globalCompositeOperation = "screen";
    var particleTime = reducedMotion ? 0 : elapsed * Math.max(0, opt.starSpeed);
    var colorHue = fract((252 + opt.hue) / 360) * 360;
    for (var i = 0; i < count; i++) {
      var star = stars[i];
      var x = fract(star.x + particleTime * 0.0022 * star.drift) * width;
      var y = fract(star.y - particleTime * 0.0008 * star.depth + 1) * height;
      var twinkle = reducedMotion ? 0.78 : 0.58 + Math.sin(particleTime * (0.8 + star.depth) + star.phase) * 0.24;
      var alpha = Math.max(0.08, twinkle * (0.22 + star.depth * 0.48));
      var radius = Math.max(0.35, star.size * star.depth * Math.max(0.25, opt.starSize));
      starCtx.fillStyle = "hsla(" + colorHue + ", 84%, " + (72 + star.depth * 20) + "%, " + alpha + ")";
      starCtx.beginPath();
      starCtx.arc(x, y, radius, 0, Math.PI * 2);
      starCtx.fill();
    }
    starCtx.globalCompositeOperation = "source-over";
  }

  function render(now) {
    var elapsed = (now - startedAt) * 0.001;
    drawStars(elapsed);
    gl.uniform1f(U.time, elapsed * opt.speed);
    gl.uniform1f(U.smokeScale, Math.max(0.01, opt.smokeScale));
    gl.uniform1f(U.smokeStrength, Math.max(0, opt.smokeStrength));
    gl.uniform1f(U.smokeSpeed, Math.max(0, opt.smokeSpeed));
    gl.uniform1f(U.hue, opt.hue * Math.PI / 180);
    gl.uniform1f(U.saturation, Math.max(0, opt.saturation));
    gl.uniform1f(U.glow, Math.max(0, opt.glow));
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
