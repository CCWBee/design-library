<!--
  Article Headings — decode/wipe heading reveal (CSS + vanilla JS)
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/TSX component wiring, TextAnimationCollection variant switcher,
  product copy, the "ThreeUI Fragment Mono" webfont (replaced with system stack),
  and the shared multi-effect stylesheet (kept only the rules this effect uses).
-->
<title>Article Headings</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: #030304;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .stage {
    width: min(92vw, 860px);
    height: min(80vh, 520px);
  }

  .article-headings-component {
    position: relative;
    container-type: inline-size;
    isolation: isolate;
    display: grid;
    grid-template-rows: auto 1fr 1fr;
    width: 100%;
    height: 100%;
    padding: clamp(20px, 5.4cqw, 74px) clamp(20px, 6.2cqw, 86px);
    overflow: hidden;
    color: #ecece8;
    background: #0b0b0b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .article-headings-component::after {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    content: "";
    opacity: 0.12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
  }

  .article-headings-component__header {
    display: flex;
    justify-content: space-between;
    padding-bottom: clamp(14px, 2.6cqw, 30px);
    color: #62625e;
    font: 400 clamp(8px, 0.85cqw, 10px) / 1 ui-monospace, "Segoe UI Mono", monospace;
    letter-spacing: 0.12em;
  }

  .article-headings-component__entry {
    display: grid;
    grid-template-columns: clamp(28px, 4cqw, 56px) minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(10px, 2.2cqw, 30px);
    border-top: 1px solid #2a2a28;
  }

  .article-headings-component__entry h2 {
    margin: 0;
    color: #e9e9e5;
    font-size: clamp(18px, 3.2cqw, 44px);
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.02em;
  }

  .article-headings-component__index,
  .article-headings-component__meta {
    color: #60605c;
    font: 400 clamp(8px, 0.85cqw, 10px) / 1.3 ui-monospace, "Segoe UI Mono", monospace;
    letter-spacing: 0.06em;
  }

  .article-headings-component__meta {
    text-align: right;
  }

  @media (max-width: 600px) {
    .article-headings-component {
      padding: 18px;
    }

    .article-headings-component__entry {
      grid-template-columns: 24px minmax(0, 1fr);
    }

    .article-headings-component__entry h2 {
      font-size: clamp(17px, 5.5vw, 26px);
    }

    .article-headings-component__meta {
      display: none;
    }
  }

  .replay {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 10;
    padding: 8px 16px;
    color: #ecece8;
    background: #0b0b0b;
    border: 1px solid #2a2a28;
    border-radius: 999px;
    font: 400 11px/1 ui-monospace, "Segoe UI Mono", monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  .replay:hover {
    border-color: #4a4a46;
  }
</style>

<div class="stage">
  <div class="article-headings-component" id="root">
    <div class="article-headings-component__header">
      <span>FIELD NOTES</span>
      <span>02 ENTRIES</span>
    </div>
    <article class="article-headings-component__entry">
      <span class="article-headings-component__index">01</span>
      <h2 data-article-heading>Context Is Infrastructure, Not a Prompt</h2>
      <span class="article-headings-component__meta">SYSTEMS NOTE · 8 MIN</span>
    </article>
    <article class="article-headings-component__entry">
      <span class="article-headings-component__index">02</span>
      <h2 data-article-heading>The Last Mile Is Verification</h2>
      <span class="article-headings-component__meta">FIELD GUIDE · 11 MIN</span>
    </article>
  </div>
</div>

<button class="replay" id="replay" type="button">REPLAY</button>

<script>
  (function () {
    "use strict";

    var DECODE_POOL = "#%&@$/\\<>*+=~ABCDEFGHKMNPRSTUVWXYZ0123456789";

    var OPTIONS = {
      duration: 560,
      stagger: 140,
      scrambleLength: 10,
      preserveChance: 0.3,
      tailChance: 0.18,
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function easeOut(value) {
      return 1 - Math.pow(1 - value, 2);
    }

    function startArticleHeadingDecode(root, options) {
      var frames = [];
      var originals = new Map();
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function decodeElement(element, delay) {
        if (reduced) return;

        var nodes = [];
        (function walk(node) {
          var children = node.childNodes;
          for (var i = 0; i < children.length; i += 1) {
            var child = children[i];
            if (child.nodeType === Node.TEXT_NODE && child.textContent && child.textContent.trim()) {
              var original = child.textContent || "";
              originals.set(child, original);
              nodes.push({ node: child, original: original });
            } else if (child.nodeType === Node.ELEMENT_NODE) {
              walk(child);
            }
          }
        })(element);

        var total = nodes.reduce(function (sum, node) { return sum + node.original.length; }, 0);
        var start = performance.now() + delay;

        function frame(now) {
          var progress = clamp((now - start) / Math.max(1, options.duration), 0, 1);
          if (now < start) {
            frames.push(requestAnimationFrame(frame));
            return;
          }

          var budget = Math.floor(easeOut(progress) * total);
          for (var i = 0; i < nodes.length; i += 1) {
            var textNode = nodes[i];
            var length = textNode.original.length;
            var revealed = clamp(budget, 0, length);
            budget -= revealed;
            if (revealed >= length) {
              textNode.node.textContent = textNode.original;
              continue;
            }

            var output = textNode.original.slice(0, revealed);
            var scrambleLength = Math.min(length - revealed, Math.round(options.scrambleLength));
            for (var s = 0; s < scrambleLength; s += 1) {
              var original = textNode.original[revealed + s];
              output += original === " " || Math.random() < options.preserveChance
                ? original
                : DECODE_POOL[(Math.random() * DECODE_POOL.length) | 0];
            }
            output += textNode.original
              .slice(revealed + scrambleLength)
              .replace(/\S/g, function (character) {
                return Math.random() < options.tailChance
                  ? DECODE_POOL[(Math.random() * DECODE_POOL.length) | 0]
                  : character;
              });
            textNode.node.textContent = output;
          }

          if (progress < 1) {
            frames.push(requestAnimationFrame(frame));
          }
        }
        frames.push(requestAnimationFrame(frame));
      }

      var headings = root.querySelectorAll("[data-article-heading]");
      headings.forEach(function (element, index) {
        decodeElement(element, index * options.stagger);
      });

      return function stop() {
        frames.forEach(cancelAnimationFrame);
        originals.forEach(function (original, node) {
          node.textContent = original;
        });
      };
    }

    var root = document.getElementById("root");
    var stop = null;

    function play() {
      if (stop) stop();
      stop = startArticleHeadingDecode(root, OPTIONS);
    }

    document.getElementById("replay").addEventListener("click", play);
    play();
  })();
</script>
