<!--
  Flux Vortex
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN + Iconify, Google Fonts (Space Grotesk), GSAP (loader/nav/scroll-reveal/glitch
  animations), EffectComposer/RenderPass/UnrealBloomPass post-processing (not present in the vendored
  three.min.js build; additive-blended points already read as glowing), all marketing copy/nav/CTA markup.
  Kept: the swirling particle-funnel vortex, dual spiral guide lines, ambient starfield, mouse-driven
  parallax tilt, all rendered with plain Three.js (r150 UMD build) and hand-written CSS.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flux Vortex</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #050505;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  .frame {
    position: fixed;
    inset: 24px;
    border-left: 1px solid rgba(255,255,255,0.1);
    border-right: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
    z-index: 5;
  }
  @media (min-width: 768px) { .frame { inset: 48px; } }
  .corner {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #111;
    border: 1px solid #737373;
  }
  .corner.tl { top: 0; left: -3px; transform: translateY(-50%); }
  .corner.tr { top: 0; right: -3px; transform: translateY(-50%); }
  .corner.bl { bottom: 0; left: -3px; transform: translateY(50%); }
  .corner.br { bottom: 0; right: -3px; transform: translateY(50%); }

  .label {
    position: fixed;
    top: 30px;
    left: 30px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #737373;
    font-weight: 300;
  }
  @media (min-width: 768px) { .label { top: 54px; left: 54px; } }

  .coords {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 10;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    color: #a3a3a3;
    font-weight: 300;
  }
  @media (min-width: 768px) { .coords { bottom: 54px; left: 54px; } }

  .hint {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 10;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #525252;
    font-weight: 300;
  }
  @media (min-width: 768px) { .hint { bottom: 54px; right: 54px; } }
</style>
</head>
<body>

<div id="stage"><canvas id="webgl-canvas"></canvas></div>

<div class="frame">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
</div>

<div class="label">Flux Vortex</div>
<div class="coords" id="coords">0.00.0.00</div>
<div class="hint">Move to steer</div>

<script src="three.min.js"></script>
<script>
(function () {
  const config = {
    bg: 0x050505,
    primary: 0xdddddd,
    secondary: 0x555555
  };

  const canvas = document.getElementById('webgl-canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(config.bg);
  scene.fog = new THREE.FogExp2(config.bg, 0.04);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 7;

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: false,
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const mainGroup = new THREE.Group();
  scene.add(mainGroup);

  // --- Vortex particle field ---
  const vortexCount = 9500;
  const vortexPositions = new Float32Array(vortexCount * 3);
  const vortexRadius = new Float32Array(vortexCount);
  const vortexAngle = new Float32Array(vortexCount);
  const vortexHeight = new Float32Array(vortexCount);
  const vortexSpeed = new Float32Array(vortexCount);

  for (let i = 0; i < vortexCount; i++) {
    const i3 = i * 3;
    const y = (Math.random() - 0.5) * 7.5;
    const funnel = 0.4 + Math.abs(y) * 0.2;
    const r = (0.1 + Math.pow(Math.random(), 1.5) * 2.5) * funnel;
    const a = Math.random() * Math.PI * 2;

    vortexHeight[i] = y;
    vortexRadius[i] = r;
    vortexAngle[i] = a;
    vortexSpeed[i] = 0.5 + Math.random() * 0.8;

    vortexPositions[i3] = Math.cos(a) * r;
    vortexPositions[i3 + 1] = y;
    vortexPositions[i3 + 2] = Math.sin(a) * r;
  }

  const vortexGeometry = new THREE.BufferGeometry();
  vortexGeometry.setAttribute('position', new THREE.BufferAttribute(vortexPositions, 3));
  const vortexMaterial = new THREE.PointsMaterial({
    size: 0.006,
    color: config.primary,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const vortexPoints = new THREE.Points(vortexGeometry, vortexMaterial);
  mainGroup.add(vortexPoints);

  // --- Spiral guide lines ---
  function createSpiralLine(turnOffset, color) {
    const spiralPoints = [];
    const pointCount = 400;
    for (let i = 0; i < pointCount; i++) {
      const t = i / (pointCount - 1);
      const angle = t * Math.PI * 14 + turnOffset;
      const radius = 0.2 + t * 2.8;
      const y = (0.5 - t) * 6.0;
      spiralPoints.push(new THREE.Vector3(
        Math.cos(angle) * radius,
        y,
        Math.sin(angle) * radius
      ));
    }
    const spiralGeometry = new THREE.BufferGeometry().setFromPoints(spiralPoints);
    const spiralMaterial = new THREE.LineBasicMaterial({
      color,
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending
    });
    return new THREE.Line(spiralGeometry, spiralMaterial);
  }

  const spiralLineA = createSpiralLine(0, config.secondary);
  const spiralLineB = createSpiralLine(Math.PI, config.primary);
  mainGroup.add(spiralLineA);
  mainGroup.add(spiralLineB);

  // --- Ambient starfield ---
  const particlesGeometry = new THREE.BufferGeometry();
  const particlesCount = 300;
  const posArray = new Float32Array(particlesCount * 3);
  for (let i = 0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 12;
  }
  particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const particlesMaterial = new THREE.PointsMaterial({
    size: 0.008,
    color: config.secondary,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending
  });
  const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
  scene.add(particlesMesh);

  // --- Interaction state ---
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;
  let windowHalfX = window.innerWidth / 2;
  let windowHalfY = window.innerHeight / 2;

  const coordsEl = document.getElementById('coords');

  function updatePointer(clientX, clientY) {
    mouseX = clientX - windowHalfX;
    mouseY = clientY - windowHalfY;
    const xVal = (clientX / window.innerWidth).toFixed(2);
    const yVal = (clientY / window.innerHeight).toFixed(2);
    coordsEl.textContent = xVal + '.' + yVal + '.00';
  }

  window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  const clock = new THREE.Clock();

  function animate() {
    const elapsedTime = clock.getElapsedTime();

    targetX = mouseX * 0.001;
    targetY = mouseY * 0.0008;

    mainGroup.rotation.y += 0.002;
    mainGroup.rotation.y += 0.03 * (targetX - mainGroup.rotation.y);
    mainGroup.rotation.x += 0.03 * (targetY - mainGroup.rotation.x);

    const positions = vortexGeometry.attributes.position.array;
    for (let i = 0; i < vortexCount; i++) {
      const i3 = i * 3;
      const spin = elapsedTime * vortexSpeed[i] * 0.5 + vortexHeight[i] * 0.5;
      const angle = vortexAngle[i] + spin;
      const pulse = Math.sin(elapsedTime * 1.2 + i * 0.01) * 0.05;
      const radius = vortexRadius[i] + pulse;

      positions[i3] = Math.cos(angle) * radius;
      positions[i3 + 1] = vortexHeight[i] + Math.sin(elapsedTime + i * 0.02) * 0.03;
      positions[i3 + 2] = Math.sin(angle) * radius;
    }
    vortexGeometry.attributes.position.needsUpdate = true;

    spiralLineA.rotation.y = elapsedTime * 0.15;
    spiralLineB.rotation.y = -elapsedTime * 0.12;

    particlesMesh.rotation.y = elapsedTime * 0.03;
    particlesMesh.rotation.x = -mouseY * 0.0001;

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    windowHalfX = window.innerWidth / 2;
    windowHalfY = window.innerHeight / 2;
  });

  animate();
})();
</script>
</body>
</html>
