<!--
  Particle Drift
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN, iconify-icon, GSAP + ScrollTrigger, Google Fonts, marketing copy/card/badge/button/slider chrome, noise-texture overlay image. Kept: the Canvas2D particle-drift effect (drifting ASCII nodes, proximity lines, upward beams, mouse interaction), rebuilt with plain CSS and a native requestAnimationFrame loop, no GSAP fade-in required.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Drift</title>
<style>
  :root {
    --bg: #030509;
    --line: rgba(156, 163, 175, 0.4);
    --accent: #60A5FA;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .label {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(156, 163, 175, 0.5);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="particle-canvas"></canvas>
<div class="label">Particle Drift</div>

<script>
(function () {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let nodes = [];
  let beams = [];
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*()'.split('');
  let mouse = { x: -1000, y: -1000 };

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }

  function initParticles() {
    const density = Math.max(60, Math.min(160, Math.floor((width * height) / 12000)));
    nodes = Array.from({ length: density }).map(() => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vy: (Math.random() * 0.4) + 0.1,
      char: chars[Math.floor(Math.random() * chars.length)]
    }));

    beams = Array.from({ length: 25 }).map(() => ({
      x: Math.random() * width,
      y: Math.random() * height,
      length: Math.random() * 100 + 50,
      speed: (Math.random() * 6) + 3,
      opacity: Math.random() * 0.5 + 0.3
    }));
  }

  window.addEventListener('resize', () => {
    resize();
    initParticles();
  });

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  resize();
  initParticles();

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // 1. Upward beams (fast)
    beams.forEach(b => {
      b.y -= b.speed;
      if (b.y + b.length < 0) {
        b.y = height + 100;
        b.x = Math.random() * width;
      }
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.length);
      g.addColorStop(0, `rgba(96, 165, 250, ${b.opacity})`);
      g.addColorStop(1, 'transparent');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + b.length);
      ctx.stroke();
    });

    // 2. Interactive ASCII nodes
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Proximity lines
    ctx.lineWidth = 0.5;
    for (let i = 0; i < nodes.length; i++) {
      const n1 = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const n2 = nodes[j];
        const d = Math.hypot(n1.x - n2.x, n1.y - n2.y);
        if (d < 120) {
          ctx.strokeStyle = `rgba(156, 163, 175, ${0.15 * (1 - d / 120)})`;
          ctx.beginPath();
          ctx.moveTo(n1.x, n1.y);
          ctx.lineTo(n2.x, n2.y);
          ctx.stroke();
        }
      }
    }

    nodes.forEach(n => {
      n.y += n.vy; // slow drift
      if (n.y > height + 20) {
        n.y = -20;
        n.x = Math.random() * width;
      }

      const dist = Math.hypot(mouse.x - n.x, mouse.y - n.y);

      // dynamic character swap
      if (dist < 180 || Math.random() > 0.98) n.char = chars[Math.floor(Math.random() * chars.length)];

      // mouse connection
      if (dist < 180) {
        ctx.strokeStyle = `rgba(96, 165, 250, ${0.5 * (1 - dist / 180)})`;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }

      ctx.fillStyle = dist < 180 ? '#60A5FA' : 'rgba(156, 163, 175, 0.4)';
      ctx.fillText(n.char, n.x, n.y);
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
