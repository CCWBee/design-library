<!--
  Digital Expanse
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License.
  Stripped: Tailwind scaffolding, GSAP/ScrollTrigger scroll animations, Iconify icons,
  Supabase-hosted images, editorial copy and page layout. Kept only the WebGL
  fragment-shader horizon field, now driven by a plain requestAnimationFrame loop
  and filling the full viewport at rest.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Expanse</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script src="three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('glcanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const scene = new THREE.Scene();
  const geometry = new THREE.PlaneGeometry(2, 2);

  const uniforms = {
    u_time: { value: 0.0 },
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
  };

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec2 u_resolution;
      uniform float u_time;

      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
      }

      void main() {
        vec2 st = gl_FragCoord.xy / u_resolution.xy;
        float numBars = 11.0;
        float barIndex = floor(st.x * numBars);
        float t = barIndex / (numBars - 1.0);

        // Breathing pulse animation
        float anim = sin(u_time * 0.5 + t * 3.0) * 0.025;

        // Curve for horizon line
        float targetHeight = 0.15 + pow(t, 1.3) * 0.5 + anim;

        // Colour gradient: dark base to blue/pink mid to cutoff
        vec3 colorBase = vec3(0.04, 0.04, 0.06);
        vec3 colorMid = mix(vec3(0.1, 0.3, 0.8), vec3(0.8, 0.2, 0.5), st.x);
        vec3 color = mix(colorBase, colorMid, smoothstep(0.1, 0.7, st.y));

        // Stepped horizon cutoff against the dark ground
        if (st.y > targetHeight) {
          gl_FragColor = vec4(0.04, 0.04, 0.047, 1.0);
          return;
        }

        // High-frequency film grain
        float noise = random(st * (u_time * 0.1)) * 0.15;
        gl_FragColor = vec4(color + noise, 1.0);
      }
    `,
    transparent: true
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  const animate = (time) => {
    uniforms.u_time.value = time * 0.001;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  };
  requestAnimationFrame(animate);

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
