<!--
  CRT — localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License.
  Stripped: React component wrapper (CrtBackground.tsx), the ResizeObserver/IntersectionObserver
  lifecycle plumbing, the product-branded "Matrix" boot-log text (Zion Mainframe / Nebuchadnezzar /
  red pill copy), and all TypeScript module scaffolding. The WebGL curvature + scanline + grille +
  chromatic-aberration fragment shader is preserved verbatim; the terminal boot log has been swapped
  for a neutral placeholder log so no third-party fiction is reproduced.
-->
<title>CRT Display</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #03100a; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #label {
    position: fixed;
    left: 1.25rem;
    bottom: 1.25rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(180, 255, 210, 0.55);
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
</style>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="label">CRT display shader</div>
<script>
(function () {
  "use strict";

  // ---- options (equivalent to CRT_DEFAULTS in the original component) ----
  var options = { speed: 1, typeSpeed: 1, motion: 1, brightness: 1, opacity: 1, hue: 0, saturation: 1 };

  // ---- neutral placeholder boot log (replaces the original "Matrix" themed copy) ----
  function segment(text, color) { return { t: text, c: color || "p" }; }
  function dots(count) { var s = ""; for (var i = 0; i < count; i++) s += "·"; return s + " "; }
  var LOG = [
    [segment("TERMINAL BOOT  v2.4.0"), segment("   session start", "d")],
    [segment("Console link  rev 3  unit CR-4471", "d")],
    [],
    [segment("Checking display array "), segment(dots(14), "d"), segment("OK", "a")],
    [segment("Signal path  0x000-0x0FF "), segment(dots(11), "d"), segment("ONLINE "), segment("OK", "a")],
    [segment("Scanning input channels "), segment(dots(6), "d"), segment("3 found")],
    [segment("chan0  PRIMARY FEED ", "d"), segment(dots(6), "d"), segment("READY", "a")],
    [segment("chan1  AUX DISPLAY ", "d"), segment("READY", "a")],
    [segment("chan2  SYNC LOCK ", "d"), segment(dots(4), "d"), segment("LINK", "a")],
    [segment("chan3  BACKUP TRACE ", "d"), segment(dots(4), "d"), segment("READY", "a")],
    [segment("Mounting local store "), segment(dots(6), "d"), segment("OK", "a")],
    [segment("Loading display profile "), segment(dots(4), "d"), segment("OK", "a")],
    [segment("Calibrating [ hue sat gain ] "), segment(dots(4), "d"), segment("OK", "a")],
    [segment("Verifying phosphor map "), segment(dots(6), "d"), segment("99.9%")],
    [],
    [segment("STATUS  "), segment("nominal.", "h")],
    [segment("all channels steady ", "d"), segment("z", "d"), segment("Z", "d")],
    [],
    [segment("ready: ")]
  ];
  var COLORS = {
    p: { fill: "#8df0b4", glow: "rgba(28,236,132,0.95)" },
    d: { fill: "#4f9a76", glow: "rgba(28,236,132,0.45)" },
    a: { fill: "#ffba5e", glow: "rgba(255,150,52,0.95)" },
    h: { fill: "#eafff3", glow: "rgba(120,255,190,0.95)" }
  };
  function lineLength(line) { var t = 0; for (var i = 0; i < line.length; i++) t += line[i].t.length; return t; }
  var TOTAL = 0, MAX_CHARS = 0;
  for (var li = 0; li < LOG.length; li++) { var len = lineLength(LOG[li]); TOTAL += len; if (len > MAX_CHARS) MAX_CHARS = len; }

  // ---- shaders (verbatim from crtShaders.ts) ----
  var CRT_VERTEX_SHADER = "attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos,0.0,1.0); }";
  var CRT_FRAGMENT_SHADER =
    "precision highp float;\n" +
    "uniform sampler2D uTex;\n" +
    "uniform vec2 uRes;\n" +
    "uniform float uTime;\n" +
    "uniform float uMotion;\n" +
    "float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }\n" +
    "vec2 curve(vec2 uv){\n" +
    "  uv = uv*2.0-1.0;\n" +
    "  vec2 o = uv.yx*uv.yx;\n" +
    "  uv += uv * o * vec2(0.115,0.165);\n" +
    "  uv = uv*0.5+0.5;\n" +
    "  return uv;\n" +
    "}\n" +
    "void main(){\n" +
    "  vec2 fuv = gl_FragCoord.xy / uRes;\n" +
    "  vec2 uv = curve(fuv);\n" +
    "  vec2 inb = step(vec2(0.0), uv) * step(uv, vec2(1.0));\n" +
    "  float inside = inb.x*inb.y;\n" +
    "  vec2 ed = min(uv, 1.0-uv);\n" +
    "  inside *= smoothstep(0.0,0.020, min(ed.x,ed.y));\n" +
    "  vec2 dir = uv-0.5;\n" +
    "  float d2 = dot(dir,dir);\n" +
    "  vec2 ao = dir * (0.0016 + 0.012*d2);\n" +
    "  vec3 col;\n" +
    "  col.r = texture2D(uTex, uv + ao).r;\n" +
    "  col.g = texture2D(uTex, uv).g;\n" +
    "  col.b = texture2D(uTex, uv - ao).b;\n" +
    "  float lines = uRes.y*0.92;\n" +
    "  float sl = sin(uv.y*3.14159265*lines + uTime*4.0*uMotion);\n" +
    "  col *= mix(0.70,1.0, sl*sl);\n" +
    "  float gx = gl_FragCoord.x * (6.2831853/3.0);\n" +
    "  vec3 grille = 0.66 + 0.34*cos(gx + vec3(0.0,2.094,4.188));\n" +
    "  col *= grille;\n" +
    "  col *= 1.34;\n" +
    "  float bar = fract(uv.y*0.5 - uTime*0.07*uMotion);\n" +
    "  bar = smoothstep(0.0,0.05,bar)*smoothstep(0.18,0.05,bar);\n" +
    "  col += bar*0.045*uMotion;\n" +
    "  float sheen = smoothstep(0.55,0.0, distance(uv, vec2(0.50,0.15)));\n" +
    "  col += sheen*0.030*vec3(0.55,1.0,0.78);\n" +
    "  float vig = smoothstep(0.98,0.30, length((uv-0.5)*vec2(1.05,1.0)));\n" +
    "  col *= mix(0.42,1.0, vig);\n" +
    "  col *= 1.0 - 0.028*uMotion*sin(uTime*8.0);\n" +
    "  col += (hash(fuv + fract(uTime*0.37)) - 0.5)*0.022;\n" +
    "  float spill = smoothstep(0.85,0.18, length(fuv-0.5))*0.05;\n" +
    "  vec3 room = vec3(0.012,0.03,0.022) + vec3(0.0,spill*0.6,spill*0.42);\n" +
    "  col = mix(room, col, inside);\n" +
    "  col = max(col, vec3(0.004,0.010,0.008));\n" +
    "  gl_FragColor = vec4(col,1.0);\n" +
    "}";

  function compile(gl, type, source) {
    var shader = gl.createShader(type);
    if (!shader) throw new Error("Unable to create CRT shader");
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader) || "CRT shader compilation failed");
    return shader;
  }

  var host = document.getElementById("stage");
  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false, depth: false, premultipliedAlpha: false });
  if (!gl) { host.textContent = "WebGL is not available in this browser."; return; }

  var textCanvas = document.createElement("canvas");
  var textContext = textCanvas.getContext("2d");

  var vertex = compile(gl, gl.VERTEX_SHADER, CRT_VERTEX_SHADER);
  var fragment = compile(gl, gl.FRAGMENT_SHADER, CRT_FRAGMENT_SHADER);
  var program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "CRT link failed");
  gl.useProgram(program);

  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var position = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  var uTexture = gl.getUniformLocation(program, "uTex");
  var uResolution = gl.getUniformLocation(program, "uRes");
  var uTime = gl.getUniformLocation(program, "uTime");
  var uMotion = gl.getUniformLocation(program, "uMotion");
  var texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(uTexture, 0);

  var width = 1, height = 1, fontSize = 14, lineHeight = 20, startY = 0, charWidth = 8;
  var caretX = 0, caretY = 0, typed = 0, done = false, textDirty = true;
  var lastTextAt = 0, lastReveal = -1, lastBlink = -1;
  var startedAt = performance.now();

  function layout() {
    startY = height * 0.135;
    lineHeight = (height * 0.74) / LOG.length;
    fontSize = Math.max(5, Math.min(lineHeight * 0.8, (width * 0.88) / (Math.max(MAX_CHARS, 1) * 0.62)));
    textContext.font = "600 " + fontSize.toFixed(2) + "px ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace";
    charWidth = textContext.measureText("M").width || fontSize * 0.6;
  }

  function setStyle(key) {
    var color = COLORS[key];
    textContext.fillStyle = color.fill;
    textContext.shadowColor = color.glow;
    textContext.shadowBlur = fontSize * 0.55;
  }

  function drawScreen(reveal) {
    textContext.setTransform(1, 0, 0, 1, 0, 0);
    textContext.fillStyle = "#03100a";
    textContext.fillRect(0, 0, width, height);
    textContext.textBaseline = "top";
    textContext.font = "600 " + fontSize.toFixed(2) + "px ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace";
    var remaining = reveal, y = startY;
    caretX = Math.floor((width - MAX_CHARS * charWidth) / 2);
    caretY = startY;
    for (var i = 0; i < LOG.length; i++) {
      var line = LOG[i];
      var length = lineLength(line);
      var visible = reveal === Infinity ? Infinity : Math.min(remaining, length);
      var x = Math.floor((width - MAX_CHARS * charWidth) / 2), drawn = 0;
      for (var j = 0; j < line.length; j++) {
        var item = line[j], text = item.t;
        if (visible !== Infinity) {
          var left = visible - drawn;
          if (left <= 0) break;
          if (left < text.length) text = text.slice(0, left);
        }
        if (text.length) {
          setStyle(item.c);
          textContext.fillText(text, x, y);
          x += charWidth * text.length;
        }
        drawn += item.t.length;
        if (visible !== Infinity && drawn >= visible) break;
      }
      caretX = x;
      caretY = y;
      if (visible !== Infinity) remaining -= visible;
      y += lineHeight;
      if (visible !== Infinity && remaining <= 0) break;
    }
  }

  function drawCursor() {
    textContext.shadowColor = COLORS.p.glow;
    textContext.shadowBlur = fontSize * 0.6;
    textContext.fillStyle = "#bdf8d2";
    textContext.fillRect(caretX, caretY + fontSize * 0.06, Math.max(charWidth * 0.92, 4), fontSize * 0.96);
  }

  function uploadTexture() {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    textDirty = false;
  }

  function resize() {
    var bounds = host.getBoundingClientRect();
    var viewportWidth = Math.max(1, bounds.width), viewportHeight = Math.max(1, bounds.height);
    var scale = viewportWidth < 700 ? 0.82 : 0.55;
    var bufferWidth = Math.min(Math.round(viewportWidth * scale), 1400);
    var bufferHeight = Math.round((bufferWidth * viewportHeight) / viewportWidth);
    if (canvas.width !== bufferWidth || canvas.height !== bufferHeight || width !== bufferWidth) {
      canvas.width = bufferWidth;
      canvas.height = bufferHeight;
      textCanvas.width = bufferWidth;
      textCanvas.height = bufferHeight;
      width = bufferWidth;
      height = bufferHeight;
      layout();
      lastReveal = -1;
      lastBlink = -1;
    }
    gl.viewport(0, 0, bufferWidth, bufferHeight);
    gl.uniform2f(uResolution, bufferWidth, bufferHeight);
  }

  function maybeRedrawText(now) {
    var reveal = done ? Infinity : Math.floor(typed);
    var blink = Math.floor((now - startedAt) / 420) % 2 === 0 ? 1 : 0;
    var due = !done ? now - lastTextAt > 42 : blink !== lastBlink;
    if (reveal === lastReveal && blink === lastBlink && !due) return;
    if (!done && now - lastTextAt <= 42 && reveal === lastReveal && blink === lastBlink) return;
    drawScreen(reveal);
    if (blink) drawCursor();
    lastTextAt = now;
    lastReveal = reveal;
    lastBlink = blink;
    textDirty = true;
  }

  function render(now) {
    if (!done) {
      typed += 4.4 * options.typeSpeed;
      if (typed >= TOTAL) { typed = TOTAL; done = true; }
    }
    maybeRedrawText(now);
    if (textDirty) uploadTexture();
    gl.useProgram(program);
    gl.uniform1f(uTime, (now - startedAt) * 0.001 * options.speed);
    gl.uniform1f(uMotion, options.motion);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  host.style.filter = "hue-rotate(" + options.hue + "deg) saturate(" + options.saturation + ") brightness(" + options.brightness + ")";
  host.style.opacity = String(options.opacity);

  resize();
  window.addEventListener("resize", resize);

  var frame = 0, visible = true;
  document.addEventListener("visibilitychange", function () {
    visible = !document.hidden;
    if (visible && !frame) frame = requestAnimationFrame(tick);
  });
  function tick(now) {
    render(now);
    frame = visible && !document.hidden ? requestAnimationFrame(tick) : 0;
  }
  frame = requestAnimationFrame(tick);
})();
</script>
