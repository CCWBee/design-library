<!--
  Condensation (frosted-glass water-droplet effect)
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: React/useEffect wrapper, TypeScript types, Tailwind classes, marketing scaffolding; reimplemented as plain Canvas2D + vanilla JS.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condensation</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #16202e 0%, #0a0f16 70%, #05080c 100%);
    overflow: hidden;
  }
  .condensation {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .condensation canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .label {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: rgba(160, 190, 225, 0.55);
    user-select: none;
  }
</style>
</head>
<body>
<div class="condensation" id="host"><canvas id="canvas"></canvas></div>
<div class="label">Condensation</div>
<script>
(function () {
  "use strict";

  var DEFAULTS = { speed: 1, dropAmount: 1, opacity: 1 };
  var options = DEFAULTS;

  var canvas = document.getElementById("canvas");
  var host = document.getElementById("host");
  var context = canvas.getContext("2d");
  if (!context) throw new Error("Condensation requires Canvas 2D");

  var width = 1, height = 1, dpr = 1, floorY = 1;
  var baseMaxDrops = 120, maxDrops = 120;
  var lastCascade = 0, simulatedNow = 0, lastFrame = 0;
  var drops = [], splashes = [];
  var bubbleSprites = new Map();

  function getBubbleSprite(radius) {
    var spriteRadius = Math.max(0.5, Math.round(radius * 2) / 2);
    var cached = bubbleSprites.get(spriteRadius);
    if (cached) return cached;

    var padding = Math.ceil(2 * dpr);
    var size = Math.ceil(spriteRadius * 2 + padding * 2);
    var sprite = document.createElement("canvas");
    sprite.width = size;
    sprite.height = size;
    var sc = sprite.getContext("2d");
    if (!sc) throw new Error("Condensation bubble sprite unavailable");
    var center = size / 2;
    var lit = spriteRadius / (4.4 * dpr);
    sc.fillStyle = "rgba(96,139,196," + (0.18 + lit * 0.22) + ")";
    sc.beginPath();
    sc.arc(center, center, spriteRadius, 0, Math.PI * 2);
    sc.fill();
    sc.strokeStyle = "rgba(70,98,148," + (0.35 + lit * 0.35) + ")";
    sc.lineWidth = 0.9 * dpr;
    sc.stroke();
    sc.fillStyle = "rgba(255,255,255," + (0.32 + lit * 0.3) + ")";
    sc.beginPath();
    sc.arc(
      center - spriteRadius * 0.32,
      center - spriteRadius * 0.36,
      Math.max(0.45 * dpr, spriteRadius * 0.24),
      0,
      Math.PI * 2
    );
    sc.fill();
    bubbleSprites.set(spriteRadius, sprite);
    return sprite;
  }

  function seedDrop(headStart) {
    headStart = headStart || 0;
    var margin = 8 * dpr;
    var availableWidth = Math.max(1, width - margin * 2);
    var availableHeight = Math.max(1, floorY - margin * 2);
    drops.push({
      x: margin + Math.random() * availableWidth,
      y: margin + Math.random() * availableHeight,
      r: (0.5 + headStart * 0.7) * dpr,
      rMax: (2.1 + Math.random() * 2.3) * dpr,
      grow: (0.0022 + Math.random() * 0.0032) * dpr,
      running: false,
      vy: 0
    });
  }

  function resize(cssWidth, cssHeight) {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
    height = canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    floorY = Math.max(1, height - 2 * dpr);
    baseMaxDrops = Math.max(80, Math.min(240, Math.round((width * height) / (dpr * dpr) / 5200)));
    maxDrops = Math.round(baseMaxDrops * options.dropAmount);
    drops = [];
    splashes = [];
    bubbleSprites.clear();
    var seedCount = Math.round(maxDrops * 0.62);
    for (var index = 0; index < seedCount; index += 1) seedDrop(Math.random() * 3);
  }

  function step(now, motionScale) {
    motionScale = motionScale == null ? 1 : motionScale;
    if (drops.length < maxDrops && Math.random() < 0.34 * motionScale) seedDrop();
    if (now - lastCascade > 6400) {
      lastCascade = now;
      drops
        .filter(function (drop) { return !drop.running; })
        .sort(function (a, b) { return b.r - a.r; })
        .slice(0, 3)
        .forEach(function (drop) {
          drop.running = true;
          drop.vy = 0.35 * dpr;
        });
    }

    for (var index = drops.length - 1; index >= 0; index -= 1) {
      var drop = drops[index];
      if (!drop.running) {
        drop.r += drop.grow * motionScale;
        if (drop.r >= drop.rMax) {
          drop.running = true;
          drop.vy = 0.3 * dpr;
        }
        continue;
      }

      drop.vy = Math.min(drop.vy + 0.075 * dpr * motionScale, 5.4 * dpr);
      drop.y += drop.vy * motionScale;
      for (var otherIndex = drops.length - 1; otherIndex >= 0; otherIndex -= 1) {
        var other = drops[otherIndex];
        if (other === drop || other.running) continue;
        var overlapsX = Math.abs(other.x - drop.x) < drop.r + other.r + 1.5 * dpr;
        var overlapsY = other.y > drop.y - drop.r && other.y < drop.y + drop.vy + drop.r;
        if (overlapsX && overlapsY) {
          drop.r = Math.sqrt(drop.r * drop.r + other.r * other.r);
          drops.splice(otherIndex, 1);
          if (otherIndex < index) index -= 1;
        }
      }

      if (drop.y >= floorY) {
        splashes.push({ x: drop.x, y: floorY, r0: drop.r, born: now });
        drops.splice(index, 1);
      }
    }
    splashes = splashes.filter(function (splash) { return now - splash.born < 760; });
  }

  function draw(now) {
    context.clearRect(0, 0, width, height);
    drops.forEach(function (drop) {
      var sprite = getBubbleSprite(drop.r);
      context.drawImage(sprite, drop.x - sprite.width / 2, drop.y - sprite.height / 2);
    });

    splashes.forEach(function (splash) {
      var progress = (now - splash.born) / 760;
      if (progress < 0 || progress > 1) return;
      var radius = splash.r0 + progress * 16 * dpr;
      context.strokeStyle = "rgba(75,108,158," + ((1 - progress) * 0.52) + ")";
      context.lineWidth = 1.1 * dpr;
      context.beginPath();
      context.ellipse(splash.x, splash.y, radius, radius * 0.34, 0, 0, Math.PI * 2);
      context.stroke();
    });
  }

  function render(now) {
    maxDrops = Math.round(baseMaxDrops * options.dropAmount);
    var delta = lastFrame ? Math.min(50, now - lastFrame) : 16.67;
    lastFrame = now;
    simulatedNow += delta * options.speed;
    step(simulatedNow, options.speed);
    draw(simulatedNow);
  }

  var frame = 0, visible = true;

  function doResize() {
    var bounds = host.getBoundingClientRect();
    resize(bounds.width, bounds.height);
    render(performance.now());
  }

  function tick(now) {
    render(now);
    frame = visible && !document.hidden ? requestAnimationFrame(tick) : 0;
  }

  window.addEventListener("resize", doResize);
  document.addEventListener("visibilitychange", function () {
    visible = !document.hidden;
    if (visible && !frame) frame = requestAnimationFrame(tick);
    if (!visible && frame) { cancelAnimationFrame(frame); frame = 0; }
  });

  doResize();
  frame = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
