<!--
  Character Carousel
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: stock headshot photos (base64 JPEGs) and invented staff names/roles, replaced
  with generated colour-coded initials avatars and neutral card labels; "Follow me" marketing
  CTA removed; the two ThreeUI source demos (character-wave.html, character-filmstrip.html)
  were merged into one file with a plain toggle switching between their two choreographies.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Character Carousel</title>
<style>
  :root {
    color-scheme: dark;
    --fg: #f3f0e9;
    --bg-wave: #141414;
    --bg-film: #d8c9ad;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b0b0b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  body {
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; }

  .switcher {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 18px;
  }

  .switcher button {
    background: none;
    border: none;
    padding: 4px 2px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }

  body[data-mode="filmstrip"] .switcher button {
    color: rgba(50, 38, 20, 0.55);
  }

  .switcher button[aria-pressed="true"] {
    color: rgba(255, 255, 255, 0.92);
    border-bottom-color: rgba(255, 255, 255, 0.5);
  }

  body[data-mode="filmstrip"] .switcher button[aria-pressed="true"] {
    color: #3a2a14;
    border-bottom-color: rgba(58, 42, 20, 0.55);
  }

  .stage {
    --pointer-x: 50%;
    --pointer-y: 50%;
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 440px;
    overflow: hidden;
    isolation: isolate;
    perspective: 1200px;
    touch-action: none;
    cursor: crosshair;
    transition: background 0.4s ease;
  }

  body[data-mode="wave"] .stage {
    background:
      radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, 0.028), transparent 24rem),
      var(--bg-wave);
  }

  body[data-mode="filmstrip"] .stage {
    cursor: ew-resize;
    background:
      linear-gradient(90deg, rgba(80, 58, 31, 0.08) 1px, transparent 1px) 50% 0 / 25% 100%,
      radial-gradient(circle at var(--pointer-x) 48%, rgba(255, 246, 220, 0.78), transparent 34%),
      var(--bg-film);
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  body[data-mode="wave"] .stage::before {
    background: radial-gradient(ellipse at center, transparent 34%, rgba(0, 0, 0, 0.13) 70%, rgba(0, 0, 0, 0.36) 120%);
  }

  body[data-mode="filmstrip"] .stage::before {
    background: linear-gradient(90deg, rgba(84, 58, 29, 0.19), transparent 14%, transparent 86%, rgba(84, 58, 29, 0.19));
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    transform: rotate(7deg);
    mix-blend-mode: soft-light;
  }

  body[data-mode="filmstrip"] .stage::after { opacity: 0.1; mix-blend-mode: multiply; }

  .deck {
    position: absolute;
    inset: 0;
    z-index: 2;
    transform-style: preserve-3d;
  }

  .card {
    --focus: 0;
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(122px, 10.45vw, 164px);
    aspect-ratio: 0.69;
    padding: clamp(8px, 0.78vw, 12px);
    border: 0;
    border-radius: clamp(10px, 1.05vw, 16px);
    color: var(--fg);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.045), transparent 34%), var(--card-color);
    box-shadow:
      0 calc(7px + var(--focus) * 20px) calc(13px + var(--focus) * 40px) rgba(0, 0, 0, calc(0.25 + var(--focus) * 0.34)),
      inset 0 1px rgba(255, 255, 255, 0.06),
      inset 0 0 0 1px rgba(0, 0, 0, 0.24);
    appearance: none;
    outline: none;
    transform-style: preserve-3d;
    will-change: transform, opacity, filter;
    cursor: pointer;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255, 255, 255, calc(0.035 + var(--focus) * 0.12));
    border-radius: inherit;
    pointer-events: none;
  }

  .card:focus-visible::after {
    border-color: rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
  }

  .portrait {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: clamp(7px, 0.75vw, 11px);
    background: rgba(8, 9, 9, 0.24);
    box-shadow: inset 0 1px rgba(255, 255, 255, 0.04), inset 0 -16px 28px rgba(0, 0, 0, 0.13);
    transform: translateZ(7px);
  }

  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: clamp(20px, 2vw, 30px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.82);
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), transparent 55%),
      var(--card-color);
  }

  .identity {
    display: grid;
    place-items: center;
    gap: clamp(2px, 0.25vw, 4px);
    margin-top: clamp(7px, 0.72vw, 11px);
    text-align: center;
    transform: translateZ(8px);
  }

  .label {
    max-width: 100%;
    overflow: hidden;
    color: rgba(255, 255, 255, 0.93);
    font-size: clamp(8px, 0.72vw, 11px);
    font-weight: 500;
    letter-spacing: -0.02em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  body[data-mode="filmstrip"] .label { color: rgba(40, 28, 12, 0.82); }

  .index {
    color: rgba(255, 255, 255, 0.42);
    font-size: clamp(4px, 0.37vw, 6px);
    letter-spacing: 0.05em;
  }

  body[data-mode="filmstrip"] .index { color: rgba(50, 36, 16, 0.5); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 680px) {
    .card { width: clamp(112px, 31vw, 138px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { will-change: auto; }
  }
</style>
</head>
<body data-mode="wave">
  <div class="switcher" role="group" aria-label="Choreography">
    <button type="button" id="btn-wave" aria-pressed="true">Wave</button>
    <button type="button" id="btn-filmstrip" aria-pressed="false">Filmstrip</button>
  </div>

  <main class="stage" id="stage" aria-label="Interactive character card carousel">
    <h1 class="sr-only">Character Carousel</h1>
    <p class="sr-only">
      Move the pointer, scroll, or use the arrow keys to explore the cards.
      Use the Wave / Filmstrip buttons to switch choreography.
    </p>
    <div class="deck" id="deck"></div>
  </main>

<script>
(() => {
  const colors = ["#414552", "#1e2b2d", "#624936", "#5b5d37", "#3a2f4d", "#1f3a3a", "#4d3a2f", "#2f3a4d", "#414552"];
  const count = colors.length;

  const body = document.body;
  const stage = document.querySelector("#stage");
  const deck = document.querySelector("#deck");
  const btnWave = document.querySelector("#btn-wave");
  const btnFilm = document.querySelector("#btn-filmstrip");

  const cards = colors.map((color, index) => {
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.dataset.index = String(index);
    const label = `Card ${String(index + 1).padStart(2, "0")}`;
    card.setAttribute("aria-label", `Focus ${label}`);
    card.style.setProperty("--card-color", color);
    card.innerHTML = `
      <span class="portrait"><span class="avatar">${String(index + 1).padStart(2, "0")}</span></span>
      <span class="identity">
        <span class="label">${label}</span>
        <span class="index" aria-hidden="true">0${index + 1} / 0${count}</span>
      </span>`;
    deck.append(card);
    return card;
  });

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let mode = "wave";

  const state = {
    phase: 2,
    targetPhase: 2,
    basePhase: 2,
    orientation: innerWidth < 680 ? 1 : 0,
    targetOrientation: innerWidth < 680 ? 1 : 0,
    pointerX: 0,
    pointerY: 0,
    tiltX: 0,
    tiltY: 0,
    active: false,
    manualOrientation: false,
    lastInput: performance.now()
  };

  function wrappedDelta(index, phase) {
    let delta = index - phase;
    while (delta > count / 2) delta -= count;
    while (delta < -count / 2) delta += count;
    return delta;
  }

  function nearestIndex() {
    return (Math.round(state.phase) % count + count) % count;
  }

  function select(index) {
    const current = nearestIndex();
    let delta = index - current;
    if (delta > count / 2) delta -= count;
    if (delta < -count / 2) delta += count;
    state.basePhase += delta;
    state.targetPhase = state.basePhase;
    state.active = false;
    state.lastInput = performance.now();
  }

  function setPointer(event) {
    const rect = stage.getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
    const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));

    state.pointerX = nx;
    state.pointerY = ny;
    state.tiltX = nx;
    state.tiltY = ny;
    state.active = true;
    state.lastInput = performance.now();

    if (mode === "wave") {
      const axis = state.targetOrientation > 0.5 ? ny : nx;
      state.targetPhase = state.basePhase + axis * (innerWidth < 680 ? 1.55 : 2.45);
    } else {
      state.targetPhase = state.basePhase + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
    }

    stage.style.setProperty("--pointer-x", `${((nx + 1) / 2) * 100}%`);
    stage.style.setProperty("--pointer-y", `${((ny + 1) / 2) * 100}%`);
  }

  function toggleOrientation() {
    if (mode !== "wave") return;
    state.manualOrientation = true;
    state.targetOrientation = state.targetOrientation > 0.5 ? 0 : 1;
    state.targetPhase = state.basePhase;
    state.lastInput = performance.now();
  }

  function setMode(next) {
    mode = next;
    body.dataset.mode = mode;
    btnWave.setAttribute("aria-pressed", String(mode === "wave"));
    btnFilm.setAttribute("aria-pressed", String(mode === "filmstrip"));
    state.targetPhase = state.basePhase;
    state.active = false;
  }

  btnWave.addEventListener("click", () => setMode("wave"));
  btnFilm.addEventListener("click", () => setMode("filmstrip"));

  cards.forEach((card, index) => {
    card.addEventListener("click", () => select(index));
    card.addEventListener("focus", () => select(index));
  });

  stage.addEventListener("pointermove", setPointer);
  stage.addEventListener("pointerdown", setPointer);
  stage.addEventListener("pointerleave", () => {
    state.active = false;
    state.targetPhase = state.basePhase;
    state.pointerX = 0;
    state.pointerY = 0;
    stage.style.setProperty("--pointer-x", "50%");
    stage.style.setProperty("--pointer-y", "50%");
  });

  stage.addEventListener("dblclick", toggleOrientation);

  stage.addEventListener("wheel", (event) => {
    event.preventDefault();
    const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
    if (!direction) return;
    state.basePhase += direction;
    state.targetPhase = state.basePhase;
    state.active = false;
    state.lastInput = performance.now();
  }, { passive: false });

  window.addEventListener("keydown", (event) => {
    if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", " "].includes(event.key)) {
      event.preventDefault();
    }
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      state.basePhase += 1;
      state.targetPhase = state.basePhase;
      state.active = false;
      state.lastInput = performance.now();
    }
    if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      state.basePhase -= 1;
      state.targetPhase = state.basePhase;
      state.active = false;
      state.lastInput = performance.now();
    }
    if (event.key === " ") toggleOrientation();
  });

  window.addEventListener("resize", () => {
    if (mode === "wave" && !state.manualOrientation) {
      state.targetOrientation = innerWidth < 680 ? 1 : 0;
    }
  });

  let previousTime = performance.now();

  function render(time) {
    const deltaTime = Math.min(32, time - previousTime);
    previousTime = time;
    const idleDelay = mode === "wave" ? 4200 : 3600;
    const easeRate = mode === "wave" ? 0.0007 : 0.001;
    const ease = reducedMotion ? 1 : 1 - Math.pow(easeRate, deltaTime / 1000);

    if (!state.active && !(mode === "wave" && state.manualOrientation) && time - state.lastInput > idleDelay) {
      const idle = time - state.lastInput - idleDelay;
      if (mode === "wave") {
        state.targetPhase = state.basePhase + Math.sin(idle * 0.00034) * 1.9;
        state.targetOrientation = (Math.sin(idle * 0.00019 - Math.PI / 2) + 1) / 2;
      } else {
        state.targetPhase = state.basePhase + Math.sin(idle * 0.00042) * 2.45;
      }
    }

    state.phase += (state.targetPhase - state.phase) * ease;
    state.orientation += (state.targetOrientation - state.orientation) * ease * 0.72;
    state.tiltX += ((state.active ? state.pointerX : 0) - state.tiltX) * ease * 0.72;
    state.tiltY += ((state.active ? state.pointerY : 0) - state.tiltY) * ease * 0.72;

    const activeIndex = nearestIndex();
    const compact = innerWidth < 650;

    cards.forEach((card, index) => {
      const delta = wrappedDelta(index, state.phase);
      const distance = Math.abs(delta);
      const direction = Math.sign(delta);
      let x, y, z, scale, rotateX, rotateY, rotateZ, focus, side, blur;

      if (mode === "wave") {
        const horizontalSpacing = Math.min(150, Math.max(102, innerWidth * 0.096));
        const verticalSpacing = Math.min(136, Math.max(99, innerHeight * 0.148));
        focus = Math.exp(-Math.pow(distance, 2) * 1.05);
        side = Math.max(0, 1 - distance / 5);

        const horizontalX = delta * horizontalSpacing;
        const horizontalY = -Math.pow(distance, 1.45) * 6 + Math.sin(delta * 0.8) * 5;
        const verticalX = Math.sin(delta * 0.82) * Math.min(78, innerWidth * 0.06) + direction * Math.pow(distance, 1.25) * 8;
        const verticalY = delta * verticalSpacing;

        x = horizontalX * (1 - state.orientation) + verticalX * state.orientation;
        y = horizontalY * (1 - state.orientation) + verticalY * state.orientation;
        z = focus * 95 - distance * 78;
        scale = 0.57 + side * 0.16 + focus * 0.38;
        rotateX = -state.tiltY * focus * 5 + delta * 2.2 * state.orientation;
        rotateY = state.tiltX * focus * 7 - delta * 8.5 * (1 - state.orientation);
        rotateZ = delta * 2.25 * (1 - state.orientation) - delta * 1.4 * state.orientation;
        blur = Math.max(0, distance - 1.35) * 0.45;
      } else {
        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));
        focus = Math.exp(-distance * distance * 1.28);
        side = Math.max(0, 1 - distance / 5);

        x = compact ? delta * 24 + Math.sin(delta * 0.9) * 25 : delta * horizontalSpacing;
        y = compact ? delta * verticalSpacing : distance * 8 + state.tiltY * focus * 10;
        z = focus * 145 - distance * 148;
        scale = 0.54 + side * 0.15 + focus * 0.54;
        rotateX = compact ? delta * 2.1 : -state.tiltY * focus * 3.5;
        rotateY = compact ? -delta * 5 : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.tiltX * focus * 3;
        rotateZ = compact ? delta * -1.4 : delta * 0.7;
        blur = Math.max(0, distance - 1.5) * 0.38;
      }

      card.style.setProperty("--focus", focus.toFixed(4));
      card.style.zIndex = String(Math.round(1000 - distance * 100));
      card.style.opacity = String(Math.max(0.14, side * 0.82 + focus * 0.18));
      card.style.filter = `blur(${blur}px) saturate(${0.72 + focus * 0.28})`;
      card.style.transform = [
        "translate(-50%, -50%)",
        `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
        `rotateX(${rotateX.toFixed(2)}deg)`,
        `rotateY(${rotateY.toFixed(2)}deg)`,
        `rotateZ(${rotateZ.toFixed(2)}deg)`,
        `scale(${scale.toFixed(4)})`
      ].join(" ");
      card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
    });

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
