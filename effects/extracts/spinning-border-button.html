<!--
  Spinning Border Button
  Localised from ThreeUI (https://github.com/MengTo/threeui) by Meng To, MIT License
  Stripped: Tailwind CDN + utility classes (rewritten as plain CSS), the auto-centering
  measurement script, "Component Preview" wrapper chrome, and the placeholder copy.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinning Border Button</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #000000;
    color: #ffffff;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 0;
    padding: 1px;
    border-radius: 9999px;
    background: none;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
  }

  /* Spinning conic border beam, only visible on hover */
  .btn .beam {
    position: absolute;
    inset: -100%;
    background: conic-gradient(from 90deg at 50% 50%, transparent 0%, transparent 75%, #ffffff 100%);
    opacity: 0;
    transition: opacity 0.3s;
    animation: spin 3s linear infinite;
  }
  .btn:hover .beam {
    opacity: 1;
  }

  /* Static border shown at rest, fades out on hover to reveal the spinning beam */
  .btn .static-border {
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    background: #27272a;
    transition: opacity 0.3s;
  }
  .btn:hover .static-border {
    opacity: 0;
  }

  /* Button surface and label */
  .btn .surface {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    height: 100%;
    padding: 0.625rem 1.5rem;
    border-radius: 9999px;
    background: linear-gradient(to bottom, #27272a, #09090b);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
    color: #a1a1aa;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .btn:hover .surface {
    color: #ffffff;
  }

  .btn svg {
    position: relative;
    z-index: 1;
    transition: transform 0.3s;
  }
  .btn:hover svg {
    transform: translateX(2px);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <button class="btn">
    <span class="beam"></span>
    <span class="static-border"></span>
    <span class="surface">
      <span>Get started</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"></path>
        <path d="m12 5 7 7-7 7"></path>
      </svg>
    </span>
  </button>
</body>
</html>
