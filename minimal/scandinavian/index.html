<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scandinavian design — before and after</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <header class="masthead" id="top">
      <div class="masthead-brand">
        <h1>/scandinavian-design</h1>
        <button type="button" class="install-cmd" id="install-cmd" aria-live="polite">
          <span>npx skills add ericzakariasson/scandinavian-design</span>
          <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          <svg class="icon-copied" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>
      <div class="byline-group">
        <a class="byline" href="https://x.com/ericzakariasson">@ericzakariasson</a>
        <a class="byline" href="https://github.com/ericzakariasson/scandinavian-design" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </header>

    <div class="shell">
      <nav class="sites" aria-label="Pages">
        <div class="nav-head">
          <p class="nav-label">Pages</p>
        </div>
        <ol id="site-list"></ol>
        <div class="seg" role="group" aria-label="Viewport">
          <button type="button" id="btn-desktop" aria-pressed="true">Desktop</button>
          <button type="button" id="btn-mobile" aria-pressed="false">Mobile</button>
        </div>
      </nav>

      <main class="stage">
        <p class="hint">
          Arrow keys move between pages. D and M switch desktop and mobile.
        </p>
        <div id="gallery"></div>
        <p class="to-top">
          <a href="#top" id="to-top">Go to top</a>
        </p>
      </main>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Expanded capture">
      <img alt="" />
    </dialog>

    <script src="site.js"></script>
  </body>
</html>
